    async 'ocr-start'(el) {
      if (!S.ocr.models.some(m => m.id === S.ocr.model) || (S.ocr.savedModel && S.ocr.savedModel !== S.ocr.model)) return banner('모델을 선택하고 저장해 주세요.', 'err');
      const pdf = S.ocrPdf;
      if (!pdf) return banner('스캔한 PDF를 먼저 골라 주세요.', 'err');
      if (!S.ocrStarts) return banner('먼저 ② 학생별로 나누기를 해 주세요.', 'err');
      const doneKeys = new Set(S.ocr.rows.filter(r => r.filled).map(r => r.pages));
      let groups = ocrGroups().filter(g => !doneKeys.has(g.key));
      const limit = Math.floor(Number(el.dataset.limit) || 0);
      if (limit > 0) groups = groups.slice(0, limit);
      if (!groups.length) return banner('추출할 학생이 없어요. 이미 모두 추출했어요.', 'info');
      if (!await preparePrompt('OCR_PROMPT')) return;
      const columns = await ocrPrepareColumns();
      if (!columns) return;
      const level = S.ocr.reasoning === 'none' ? '추론 없음' : `추론 ${S.ocr.reasoning}`;
      if (!await confirmModal('손글씨 추출',
        `학생 ${groups.length}명(${groups[0].key}쪽부터)의 글씨를 ${S.ocr.model} · ${level}로 추출할까요?\n\n표의 열: ${columns}\n열이 틀렸으면 [취소]를 누르고 추출 지침의 [추출 내용 및 방법]을 고쳐 주세요.\n\n한 명에 10초~1분쯤 걸려요. 추출하는 동안 이 창을 닫지 마세요.`,
        '추출 시작', '⚠️ 스캔한 종이 속 이름·학번도 AI에게 전달돼요.')) return;

      await call('uiOcrSaveSettings', { model: S.ocr.model, reasoning: S.ocr.reasoning });
      const run = S.ocrRun = { kind: 'extract', running: true, stop: false, stopped: false, done: 0, total: groups.length, failed: 0 };
      banner('');
      render();
      try {
        for (const group of groups) {
          if (run.stop) { run.stopped = true; break; }
          try {
            const row = await ocrExtractGroup(group);
            if (!row || row.failed) run.failed++;
          } catch (err) {
            run.failed++;
            showError(err);
          }
          run.done++;
          if (S.view === 'ocr' && !isEditing()) render();
        }
      } finally {
        run.running = false;
        render();
      }
      if (!run.stopped) banner(`${run.done}명을 읽었어요.${run.failed ? ` ${run.failed}명은 읽지 못했어요.` : ''} 결과를 원본과 비교해 확인해 주세요.`, run.failed ? 'err' : 'ok');
    },
    async 'ocr-split-ai'() {
      const pdf = S.ocrPdf;
      if (!pdf) return banner('스캔한 PDF를 먼저 골라 주세요.', 'err');
      if (!await confirmModal('AI로 학생별 나누기',
        `${pdf.pageCount}쪽을 ${S.ocr.model}(추론 없음)로 보고 학생이 바뀌는 쪽을 찾을까요?\n나눈 뒤 학생 목록이 맞는지 확인해 주세요.`,
        '나누기', '⚠️ 스캔한 종이 속 이름·학번도 AI에게 전달돼요.')) return;
      const SIZE = 4;
      const chunks = [];
      for (let p = 1; p <= pdf.pageCount; p += SIZE) chunks.push({ from: Math.max(1, p - 1), targetFrom: p, to: Math.min(p + SIZE - 1, pdf.pageCount) });
      const run = S.ocrRun = { kind: 'split', running: true, stop: false, stopped: false, done: 0, total: pdf.pageCount, failed: 0 };
      const found = {};
      const failedPages = [];
      banner('');
      render();
      try {
        for (const chunk of chunks) {
          if (run.stop) { run.stopped = true; break; }
          try {
            const data = await ocrPiece(chunk);
            const pages = await call('uiOcrDetectStarts', { firstPage: chunk.from, count: chunk.to - chunk.from + 1, contextPages: chunk.targetFrom - chunk.from, data, model: S.ocr.model });
            pages.forEach(p => { if (p.page >= chunk.targetFrom && p.page <= chunk.to) found[p.page] = p; });
          } catch (err) {
            run.failed++;
            for (let p = chunk.targetFrom; p <= chunk.to; p++) failedPages.push(p);
            showError(err);
          }
          run.done = chunk.to;
          if (S.view === 'ocr' && !isEditing()) render();
        }
      } finally {
        run.running = false;
      }
      if (!run.stopped) {
        // 판단하지 못한 쪽은 학생이 시작하는 쪽으로 두어, 다른 학생 글과 섞이지 않게 한다.
        const starts = [1];
        for (let p = 2; p <= pdf.pageCount; p++) {
          if ((found[p] && found[p].newStudent) || failedPages.includes(p)) starts.push(p);
        }
        S.ocrStarts = starts;
        S.ocrDetected = found;
        banner(`학생 ${starts.length}명으로 나눴어요.${failedPages.length ? ` ${failedPages.join(', ')}쪽은 판단하지 못해 한 쪽씩 따로 나눠 두었어요.` : ''} 쪽 목록과 이름이 맞는지 확인해 주세요.`, failedPages.length ? 'err' : 'ok');
      }
      render();
    },

      if (S.ocrRun) S.ocrRun.stop = true;
      render();
    },

        S.csv = null;
        S.manual = result;
        banner(`${result.imported}행으로 '수동추가' 시트를 ${result.overwritten ? '덮어썼어요' : '만들었어요'}.${result.backupName ? ` 예전 시트는 '${result.backupName}'에 있어요.` : ''} 아래에서 프롬프트를 확인한 뒤 [생기부 만들기]를 누르세요.`, 'ok');
      });
    },
    async 'save-manual-setup'() {
      const setup = {
        inputCols: Array.from(document.querySelectorAll('.manual-input-col:checked')).map(el => Number(el.value)),
        outputCol: Number($('#manual-output-col').value),
        startRow: Number($('#manual-start-row').value),
      };
      await withBusy('열 설정을 저장하는 중…', async () => {
        S.manual = await call('uiSaveManualSetup', setup);
        banner('열 설정을 저장했어요.', 'ok');
      });
    },
    async 'add-manual-row'() {
      const values = {};
      document.querySelectorAll('.manual-new').forEach(el => { values[el.dataset.col] = el.value; });
      await withBusy('추가하는 중…', async () => {
        S.manual = await call('uiAddManualRow', values);
        banner('한 줄을 추가했어요.', 'ok');
      });
    },
    'save-prompt'(el) {
      saveInBackground(savePrompt(el.dataset.key), '프롬프트를 저장했어요.');
    },
    'save-length'(el) {
      const error = lengthError(el.dataset.key);
      if (error) return banner(error, 'err');
      saveInBackground(saveLength(el.dataset.key), '분량을 저장했어요.');
    },
    async 'use-prompt-example'(el) {
      const key = el.dataset.key;
      if (promptDirty(key) || currentPrompt(key).trim() !== String(S.settings.defaults[key] || '').trim()) {
        if (!await confirmModal('예시로 채우기', '지금 프롬프트를 지우고 예시로 바꿀까요?\n과목·강조할 점은 내 수업에 맞게 고친 뒤 [프롬프트 저장]을 눌러 주세요.', '바꾸기')) return;
      }
      S.promptEdits[key] = PROMPT_EXAMPLES[key];
      S.promptOpen[key] = true;
      render();
    },
    async 'reset-prompt'(el) {
      const key = el.dataset.key;
      const light = el.dataset.variant === 'light';
      const label = key !== 'BEHAVIOR_RECORD_PROMPT' ? '기본 프롬프트' : light ? '기본 프롬프트(가벼운 말투)' : '기본 프롬프트(진지한 말투)';
      if (!await confirmModal('기본 프롬프트로 바꾸기', `지금 프롬프트를 지우고 ${label}로 바꿀까요?`, '바꾸기',
        '⚠ 바꾼 뒤 아래 [프롬프트 저장]을 꼭 눌러 주세요. 누르지 않으면 실제로 바뀌지 않아요.')) return;
      S.promptEdits[key] = S.settings.defaults[light ? key + '_LIGHT' : key];
      S.promptOpen[key] = true;
      render();
    },
    async 'start-manual'() {
      const errors = S.manual.errorCount;
      const pending = S.manual.pendingCount + errors;
      if (!await preparePrompt('MANUAL_PROMPT')) return;
      if (!await confirmModal('생기부 만들기', `${pending}개 행의 생기부를 AI로 만들까요?${errors ? `\n오류가 났던 ${errors}개 행도 다시 만들어요.` : ''}\n생기부 열이 이미 채워진 행은 건너뛰어요.`, '만들기')) return;
      await withBusy('생기부를 만드는 중… 창을 닫아도 계속 진행돼요.', async () => {
        const result = await call('uiStartManual', { retryErrors: errors > 0 });
        S.manual = result.data;
        afterToolStart(result, '생기부 만들기를 시작했어요.');
      });
    },
    async 'reset-manual'(el) {
      const r = S.manual.rows.find(x => x.row === Number(el.dataset.id));
      if (!await confirmModal('생기부 지우기', '이 행의 생기부와 메모를 지울까요?\n원본 데이터는 그대로 두고, [생기부 만들기]를 누르면 새로 만들어요.', '지우기')) return;
      await withBusy('지우는 중…', async () => {
        const result = await call('uiResetManualOutput', r.row, r.input);
        S.manual = result.data;
        delete S.edits[`manual:${r.row}`];
      });
    },
    async 'delete-manual-row'(el) {
      if (jobRunning('manual')) return banner('생기부를 만드는 중에는 지울 수 없어요. 끝난 뒤 다시 눌러 주세요.', 'err');
      const r = S.manual.rows.find(x => x.row === Number(el.dataset.id));
      if (!await confirmModal('행 삭제', `${r.label || `${r.row}행`}을 '수동추가' 시트에서 지울까요?\n원본 데이터와 생기부가 함께 지워지고, 되돌릴 수 없어요.`, '삭제')) return;
      await withBusy('지우는 중…', async () => {
        S.manual = await call('uiDeleteManualRow', r.row, r.input);
        Object.keys(S.edits).forEach(k => { if (k.startsWith('manual:')) delete S.edits[k]; });
      });
      banner('행을 지웠어요.', 'ok');
    },
    async 'manual-reset-all'() {
      if (jobRunning('manual')) return banner('생기부를 만드는 중에는 초기화할 수 없어요. 끝난 뒤 다시 눌러 주세요.', 'err');
      if (!await confirmModal('수동추가 모두 초기화',
        `처음 상태로 되돌릴까요?

· '수동추가' 시트와 '수동추가_백업_…' 시트를 모두 지워요. 만들어 둔 생기부도 함께 사라져요.
· 고르던 파일과 저장해 둔 설문 링크도 비워요.
· 프롬프트는 그대로 남아요.

필요하면 먼저 [엑셀로 받기]로 저장해 두세요. 되돌릴 수 없어요.`, '모두 초기화')) return;
      let result;
      await withBusy('초기화하는 중…', async () => {
        result = await call('uiResetManualAll');
        S.manual = result;
        S.csv = null;
        S.manualUrl = undefined;
        Object.keys(S.edits).forEach(k => { if (k.startsWith('manual:')) delete S.edits[k]; });
        if (S.ocr) S.ocr.manualExists = false;
      });
      if (result) banner(result.deletedSheets.length ? `수동추가를 초기화했어요. 지운 시트: ${result.deletedSheets.join(', ')}` : '수동추가를 초기화했어요.', 'ok');
    },
    async 'clear-manual'() {
      if (jobRunning('manual')) return banner('생기부를 만드는 중에는 지울 수 없어요. 끝난 뒤 다시 눌러 주세요.', 'err');
      const count = S.manual.handledCount;
      if (!await confirmModal('생기부 모두 지우기', `${count}개 행의 생기부와 메모를 모두 지울까요?\n원본 데이터는 그대로 남아요. 필요하면 먼저 [엑셀로 받기]로 저장해 두세요.`, '모두 지우기')) return;
      await withBusy('지우는 중…', async () => {
        S.manual = await call('uiClearManualOutputs');
        Object.keys(S.edits).forEach(k => { if (k.startsWith('manual:')) delete S.edits[k]; });
      });
      banner('생기부를 모두 지웠어요.', 'ok');
    },
    async 'delete-common'(el) {
      if (jobRunning('common')) return banner('문구를 만드는 중에는 지울 수 없어요. 끝난 뒤 다시 눌러 주세요.', 'err');
      const p = S.common.phrases.find(x => x.row === Number(el.dataset.id));
      if (!await confirmModal('문구 삭제', '이 문구를 지울까요?\n아래 문구들이 한 칸씩 올라와요.', '삭제')) return;
      await withBusy('지우는 중…', async () => {
        S.common = await call('uiDeleteCommonPhrase', p.row, p.text);
        Object.keys(S.edits).forEach(k => { if (k.startsWith('common:')) delete S.edits[k]; });
      });
      banner('문구를 지웠어요.', 'ok');
    },
    async 'clear-common'() {
      if (jobRunning('common')) return banner('문구를 만드는 중에는 지울 수 없어요. 끝난 뒤 다시 눌러 주세요.', 'err');
      if (!await confirmModal('문구 모두 삭제', `만든 문구 ${S.common.phrases.length}개를 모두 지울까요?\n바탕 문구와 지시사항은 그대로 남아요. 필요하면 먼저 [엑셀로 받기]로 저장해 두세요.`, '모두 삭제')) return;
      await withBusy('지우는 중…', async () => {
        S.common = await call('uiClearCommonPhrases');
        Object.keys(S.edits).forEach(k => { if (k.startsWith('common:')) delete S.edits[k]; });
      });
      banner('문구를 모두 지웠어요.', 'ok');
    },
    async 'reload-manual'() {
      await withBusy('불러오는 중…', async () => { S.manual = await call('uiGetManual'); });
    },

    'copy-tool'(el) {
      const { kind, id } = el.dataset;
      const edited = S.edits[`${kind}:${id}`];
      copyText(edited !== undefined ? edited : toolOriginal(kind, id));
    },
    async 'save-tool'(el) {
      const { kind, id } = el.dataset;
      const row = Number(id);
      const text = S.edits[`${kind}:${id}`];
      el.disabled = true;
      try {
        if (kind === 'common') {
          const p = S.common.phrases.find(x => x.row === row);
          const updated = await call('uiUpdateCommonPhrase', row, p.text, text);
          p.text = updated.text;
        } else if (kind === 'behavior') {
          const r = findBehavior(row);
          replaceBehavior(await call('uiUpdateBehaviorRecord', row, r.studentName, text));
        } else if (kind === 'manual') {
          const r = S.manual.rows.find(x => x.row === row);
          const updated = await call('uiUpdateManualOutput', row, r.input, text);
          S.manual = updated.data;
        }
        delete S.edits[`${kind}:${id}`];
        banner('저장했어요.', 'ok');
      } catch (err) {
        showError(err);
      }
      render();
    },
  };

  Object.assign(TOOL_ACTIONS, GRADING_ACTIONS);

  // 입력 중에는 다시 그리지 않고 글자수·저장 버튼만 바꾼다.
  function handleToolInput(el) {
    if (handlePromptInput(el)) return true;
    if (el.classList.contains('ocr-edit') && S.ocr) {
      const r = findOcrRow(el.dataset.id);
      if (!r) return true;
      const base = ocrRowValue(r);
      const edit = { studentId: base.studentId, name: base.name, answers: Object.assign({}, base.answers) };
      if (el.dataset.field === 'answer') edit.answers[el.dataset.item] = el.value;
      else edit[el.dataset.field] = el.value;
      const same = edit.studentId === r.studentId && edit.name === r.name &&
        Object.keys(r.answers).every(n => (edit.answers[n] || '') === (r.answers[n] || ''));
      if (same) delete S.ocrEdits[r.row]; else S.ocrEdits[r.row] = edit;
      const btn = document.querySelector(`[data-action="ocr-save"][data-id="${r.row}"]`);
      if (btn) btn.disabled = same;
      return true;
    }
    if (handleLengthInput(el)) return true;
    if (handleGradingInput(el)) return true;
    if (el.dataset.bfield && S.bDraft) {
      S.bDraft.fields[el.dataset.bfield] = el.value;
      S.bDraft.dirty = true;
      const btn = document.querySelector('[data-action="save-behavior"]');
      if (btn) btn.disabled = false;
      return true;
    }
    if (el.id === 'cp-source') {
      const counter = document.getElementById('cp-source-count');
      if (counter) counter.textContent = countLine(el.value);
      return true;
    }
    if (el.dataset.action === 'edit-tool') {
      const { kind, id } = el.dataset;
      const editKey = `${kind}:${id}`;
      S.edits[editKey] = el.value;
      if (el.value === toolOriginal(kind, id)) delete S.edits[editKey];
      const counter = document.querySelector(`[data-count="${CSS.escape(editKey)}"]`);
      if (counter) counter.textContent = countLine(el.value);
      const btn = el.parentElement.querySelector('[data-action="save-tool"]');
      if (btn) btn.disabled = el.value === toolOriginal(kind, id);
      return true;
    }
    return false;
  }

  document.addEventListener('toggle', event => {
    const key = event.target.dataset && event.target.dataset.promptCard;
    if (key) S.promptOpen[key] = event.target.open;
    if (event.target.id === 'submissions-details') S.submissionsOpen = event.target.open;
    if (event.target.id === 'hidden-assignments') S.hiddenAssignmentsOpen = event.target.open;
    const exampleKey = event.target.dataset && event.target.dataset.promptExample;
    if (exampleKey) S.promptExampleOpen[exampleKey] = event.target.open;
  }, true);

  // 수동추가 파일 칸에 끌어다 놓으면 파일 선택과 똑같이 처리한다.
  ['dragenter', 'dragover'].forEach(type => document.addEventListener(type, event => {
    const zone = event.target.closest && event.target.closest('#manual-drop');
    if (!zone || zone.classList.contains('disabled')) return;
    event.preventDefault();
    zone.classList.add('over');
  }));
  document.addEventListener('dragleave', event => {
    const zone = event.target.closest && event.target.closest('#manual-drop');
    if (zone && !zone.contains(event.relatedTarget)) zone.classList.remove('over');
  });
  document.addEventListener('drop', event => {
    const zone = event.target.closest && event.target.closest('#manual-drop');
    if (!zone) return;
    event.preventDefault();
    zone.classList.remove('over');
    const input = $('#manual-csv');
    if (zone.classList.contains('disabled') || !input || !event.dataTransfer.files.length) return;
    input.files = event.dataTransfer.files;
    handleToolChange(input);
  });

  function handleToolChange(el) {
    if (el.id === 'ocr-file' && el.files && el.files[0]) {
      const file = el.files[0];
      S.ocrLoading = true;
      render();
      Promise.all([file.arrayBuffer(), loadPdfLib()])
        .then(([buf, PDFLib]) => PDFLib.PDFDocument.load(buf, { ignoreEncryption: true }))
        .then(doc => {
          S.ocrPdf = { fileName: file.name, doc, pageCount: doc.getPageCount() };
          S.ocrRun = null;
          S.ocrDetected = {};
          S.ocrStarts = evenOcrStarts(S.ocrEven, S.ocrPdf.pageCount);
        })
        .catch(err => banner(`PDF를 읽지 못했어요: ${err.message || err}`, 'err'))
        .finally(() => { S.ocrLoading = false; render(); });
    }
    if (el.id === 'ocr-even') {
      S.ocrEven = Math.min(20, Math.max(1, Math.floor(Number(el.value) || 1)));
      if (S.ocrPdf) {
        S.ocrStarts = evenOcrStarts(S.ocrEven, S.ocrPdf.pageCount);
        S.ocrDetected = {};
      }
      render();
    }
    if ((el.id === 'ocr-model' || el.id === 'ocr-reasoning') && S.ocr) {
      S.ocr[el.id === 'ocr-model' ? 'model' : 'reasoning'] = el.value;
      render();
    }
    if (el.id === 'grading-assignment') {
      S.gradingKey = el.value;
      S.selected = new Set();
      render();
    }
    if (el.classList.contains('manual-input-col')) {
      el.closest('.chip').classList.toggle('on', el.checked);
    }
    if (el.classList.contains('csv-input-col')) {
      el.closest('.chip').classList.toggle('on', el.checked);
      S.csv.inputCols = Array.from(document.querySelectorAll('.csv-input-col:checked')).map(x => Number(x.value));
    }
    if (el.id === 'manual-csv' && el.files && el.files[0]) {
      const file = el.files[0];
      S.csvLoading = true;
      render();
      readUploadFile(file)
        .then(result => {
          S.csv = Object.assign({ fileName: file.name, book: result.book, sheets: result.sheets, sheetName: result.sheetName }, csvTable(result.table));
        })
        .catch(err => banner(`파일을 읽지 못했어요: ${err.message || err}`, 'err'))
        .finally(() => { S.csvLoading = false; render(); });
    }
    if (el.id === 'csv-sheet') {
      try {
        Object.assign(S.csv, { sheetName: el.value }, csvTable(sheetToTable(window.XLSX, S.csv.book, el.value)));
      } catch (err) {
        banner(`이 시트를 읽지 못했어요: ${err.message || err}`, 'err');
      }
      render();
    }
  }

  startApp();
</script>
