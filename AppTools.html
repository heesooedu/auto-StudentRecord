<script>
  // ---- 도구 화면: 공통문구 · 행발 추천 · 수동추가 · 채점 · 손글씨 추출 ---------------
  // AppScript.html의 S, call, esc, withBusy 등을 함께 쓴다.

  const BEHAVIOR_FIELDS = [
    { key: 'positiveObservation', label: '잘한 점 · 긍정적 관찰 (선택)', placeholder: '예: 모둠 활동에서 역할을 먼저 맡고 끝까지 책임짐' },
    { key: 'improvementNeeded', label: '보완할 점 (선택)', placeholder: '예: 친구의 말을 끝까지 듣지 않고 끼어드는 경우가 있음' },
    { key: 'growthEvidence', label: '성장한 모습 (선택)', placeholder: '예: 2학기에는 발표 순서를 기다리며 경청하려 노력함' },
  ];

  async function refreshToolData(view) {
    if (view === 'common') S.common = await call('uiGetCommonPhrases');
    if (view === 'behavior' && !S.bDraft) S.behavior = await call('uiListBehaviorRows');
    if (view === 'manual') S.manual = await call('uiGetManual');
    if (view === 'grading') S.grading = await call('uiGetGrading');
    if (view === 'ocr') S.ocr = await call('uiOcrGet');
  }

  // 결과 문구를 고치고 저장하는 공통 블록
  function toolOriginal(kind, id) {
    const row = Number(id);
    if (kind === 'common') { const p = (S.common.phrases || []).find(x => x.row === row); return p ? p.text : ''; }
    if (kind === 'behavior') { const r = (S.behavior.rows || []).find(x => x.row === row); return r ? String(r.recommendedRecord || '') : ''; }
    if (kind === 'manual') { const r = (S.manual.rows || []).find(x => x.row === row); return r ? r.output : ''; }
    return '';
  }

  function countLine(text) {
    return `${text.length}자 · ${neisBytes(text)}바이트`;
  }

  function resultEditor(kind, id, rows) {
    const editKey = `${kind}:${id}`;
    const original = toolOriginal(kind, id);
    const text = S.edits[editKey] !== undefined ? S.edits[editKey] : original;
    const dirty = text !== original;
    return `
      <textarea data-action="edit-tool" data-kind="${kind}" data-id="${id}" rows="${rows || 5}">${esc(text)}</textarea>
      <div class="row between">
        <span class="small bytes" data-count="${esc(editKey)}">${countLine(text)}</span>
        <div class="row">
          <button class="btn" data-action="copy-tool" data-kind="${kind}" data-id="${id}">복사</button>
          <button class="btn primary" data-action="save-tool" data-kind="${kind}" data-id="${id}" ${dirty ? '' : 'disabled'}>저장</button>
        </div>
      </div>`;
  }

  function jobRunning(job) {
    return !!(S.boot.status && S.boot.status[job] && S.boot.status[job].state === 'ON');
  }

  function toolDeleteButton(action, label, id) {
    return `<button class="btn danger" data-action="${action}" ${id !== undefined ? `data-id="${id}"` : ''} ${S.busy ? 'disabled' : ''}>${esc(label)}</button>`;
  }

  function resetAllButton(action) {
    return `<button class="btn danger fill" data-action="${action}" ${S.busy ? 'disabled' : ''}>모두 초기화</button>`;
  }

  function toolStartButton(job, label, disabled) {
    const running = jobRunning(job);
    return `<button class="btn primary" data-action="start-${job}" ${S.busy || running || disabled ? 'disabled' : ''}>${esc(label)}</button>`;
  }

  // ---- 공통문구 -------------------------------------------------------------
  // 마지막 실행이 오류로 멈췄고 빈 칸이 남아 있을 때만 이어서 만들기를 보여 준다.
  function commonStopped(d) {
    const st = S.boot.status && S.boot.status.common;
    return !!(st && st.state !== 'ON' && st.last && st.last.blocked && d.pending > 0);
  }

  function viewCommon() {
    const d = S.common;
    if (!d) return '<div class="loading">불러오는 중…</div>';

    const normalize = text => text.trim().replace(/\s+/g, ' ');
    const seen = {};
    d.phrases.forEach(p => { if (p.text) seen[normalize(p.text)] = (seen[normalize(p.text)] || 0) + 1; });
    const dupCount = d.phrases.filter(p => p.text && seen[normalize(p.text)] > 1).length;
    const done = d.phrases.filter(p => p.text).length;

    return `
      <h1>공통문구 만들기</h1>
      <p class="lead">바탕 문구 하나를 주면, 뜻은 같고 표현이 다른 문구를 원하는 개수만큼 만들어요.<br>
        여러 학생에게 같은 활동을 기록할 때, 문장이 똑같아지지 않게 할 때 좋아요.</p>
      ${busyNote()}
      <div class="card">
        <label class="field"><span>바탕 문구</span>
          <textarea id="cp-source" rows="4" placeholder="예: 인공지능과 미래사회 단원에서 AI 윤리 쟁점을 조사하고 자신의 입장을 논리적으로 발표함">${esc(d.sourceText)}</textarea></label>
        <div class="small bytes" id="cp-source-count" style="margin:-4px 0 8px">${countLine(d.sourceText)}</div>
        <label class="field"><span>어떻게 만들까요? (지시사항)</span>
          <textarea id="cp-prompt" rows="3" placeholder="예: 의미는 유지하되 문장 구조와 어휘를 바꿔 주세요. 200자 내외, ~함으로 끝내기">${esc(d.prompt)}</textarea></label>
        <div class="tip">공통문구에는 <b>따로 정한 글자수 기준이 없어요.</b> 설정 화면의 초안 글자수도 적용되지 않아요.
          원하는 길이가 있으면 지시사항에 <b>"200자 내외"</b>처럼 적어 주세요. 만든 문구마다 글자수와 바이트가 아래에 표시돼요.</div>
        <div class="row">
          <label class="field" style="width:140px"><span>만들 개수</span>
            <input type="number" id="cp-count" min="1" max="200" value="${esc(d.count)}"></label>
          <span class="grow"></span>
          ${toolStartButton('common', '문구 만들기')}
        </div>
        <div class="help">이전에 만든 문구는 새로 만들 때 지워져요. 필요하면 먼저 [모두 복사]로 옮겨 두세요.</div>
      </div>
      ${commonStopped(d) ? `
        <div class="card row between"><div>오류로 멈춰서 <b>${d.pending}</b>개를 아직 만들지 못했어요. 만든 문구는 그대로 두고 남은 것만 만들 수 있어요.</div>
          <button class="btn" data-action="resume-common" ${S.busy ? 'disabled' : ''}>남은 것 이어서 만들기</button></div>` : ''}
      ${statusPanel('common', '개')}

      <div class="row between" style="margin-top:8px">
        <h2 style="margin:0">만든 문구 <span class="muted small">${done}개${dupCount ? ` · <span class="pill warn">겹치는 문구 ${dupCount}개</span>` : ''}</span></h2>
        <div class="row">
          <button class="btn" data-action="reload-common">새로고침</button>
          <button class="btn" data-action="copy-all-common" ${done ? '' : 'disabled'}>모두 복사</button>
          ${done ? downloadButton('common') : ''}
          ${d.phrases.length ? toolDeleteButton('clear-common', '모두 삭제') : ''}
        </div>
      </div>
      ${d.phrases.length === 0 ? '<div class="card empty">아직 만든 문구가 없어요.</div>' : d.phrases.map((p, i) => `
        <div class="record ${p.text && seen[normalize(p.text)] > 1 ? 'dup' : ''}">
          <div class="row between"><b>${i + 1}번</b>
            <div class="row">${p.text && seen[normalize(p.text)] > 1 ? '<span class="pill warn">다른 문구와 같음</span>' : ''}
              ${toolDeleteButton('delete-common', '삭제', p.row)}</div></div>
          ${p.text ? resultEditor('common', p.row, 3) : `<div class="caution">${esc(p.error || '아직 만들지 않았어요.')}</div>`}
        </div>`).join('')}`;
  }

  // ---- 행발 추천 -------------------------------------------------------------
  // ready: [추천 문구 만들기]로 만들 수 있는 학생. 멈춘 뒤 남은 '대기'·'생성중'과 오류 난 학생도 다시 만든다.
  function behaviorState(r) {
    if (String(r.recommendedRecord || '').trim()) return { label: '추천 완료', cls: 'ok' };
    const traits = String(r.selectedTraits || '').trim() || String(r.customTraits || '').trim();
    if (!traits) return { label: '특성 필요', cls: 'warn' };
    if ((r.status === '생성중' || r.status === '대기') && jobRunning('behavior')) return { label: r.status, cls: 'run' };
    if (r.status === '오류' || r.status === '재시도필요' || r.status === '응답형식오류') return { label: `${r.status} · 다시 만들 수 있음`, cls: 'err', ready: true };
    return { label: '만들 준비 됨', cls: '', ready: true };
  }

  function splitTraits(text) {
    return String(text || '').split(/[,\n]/).map(t => t.trim()).filter(Boolean);
  }

  function behaviorEditor(r) {
    const draft = S.bDraft.fields;
    const selected = splitTraits(draft.selectedTraits);
    const traits = S.behavior.traits;
    const negative = S.behavior.negativeTraits || [];

    return `
      <div class="record open">
        <div class="row between">
          <input type="text" data-bfield="studentName" value="${esc(draft.studentName)}" placeholder="학생 이름" style="max-width:220px">
          <div class="row">
            <button class="btn danger" data-action="delete-behavior" data-id="${r.row}">학생 삭제</button>
            <button class="btn" data-action="close-behavior">닫기</button>
          </div>
        </div>
        <div class="muted small" style="margin:10px 0 6px">특성 고르기 <b>(필수, 하나 이상)</b> · 문장의 방향을 정하는 참고용이에요. 목록에 없으면 아래 칸에 적기만 해도 돼요. 관찰 내용은 모두 선택 입력이에요.</div>
        <div class="chips">${traits.map(t => `<button class="chip ${negative.includes(t) ? 'neg' : ''} ${selected.includes(t) ? 'on' : ''}" data-action="toggle-trait" data-trait="${esc(t)}">${esc(t)}</button>`).join('')}</div>
        <label class="field"><span>목록에 없는 특성 (선택, 쉼표로 구분)</span>
          <textarea data-bfield="customTraits" rows="2" placeholder="예: 유머 감각, 질투, 예의없음">${esc(draft.customTraits)}</textarea></label>
        ${BEHAVIOR_FIELDS.map(f => `
          <label class="field"><span>${esc(f.label)}</span>
            <textarea data-bfield="${f.key}" rows="2" placeholder="${esc(f.placeholder)}">${esc(draft[f.key])}</textarea></label>`).join('')}
        <div class="help">학생 이름은 AI에게 보내지 않아요. 관찰 내용은 비워 둬도 특성만으로 문구를 만들어요. 적을 때는 관찰한 사실만 적어 주세요. 성장한 모습이 없으면 '개선되었다'고 쓰지 않아요.</div>
        <div class="row" style="justify-content:flex-end;margin-top:8px">
          <button class="btn primary" data-action="save-behavior" ${S.bDraft.dirty ? '' : 'disabled'}>입력 내용 저장</button>
        </div>
        ${String(r.recommendedRecord || '').trim() ? `
          <div class="divider"></div>
          <div class="row between"><b>추천 문구</b>
            ${toolDeleteButton('reset-behavior', '추천 문구 지우기', r.row)}</div>
          ${resultEditor('behavior', r.row, 5)}
          ${r.note ? `<div class="caution">${esc(r.note)}</div>` : ''}` : r.note ? `<div class="caution">${esc(r.note)}</div>` : ''}
      </div>`;
  }

  function viewBehavior() {
    const d = S.behavior;
    if (!d) return '<div class="loading">불러오는 중…</div>';
    const ready = d.rows.filter(r => behaviorState(r).ready).length;
    const done = d.rows.filter(r => String(r.recommendedRecord || '').trim()).length;
    const text = S.filters.search.trim().toLowerCase();
    const rows = d.rows.filter(r => !text || String(r.studentName).toLowerCase().includes(text));

    return `
      <h1>행발 추천 문구</h1>
      <p class="lead">학생마다 특성을 고르고 (필요하면) 관찰한 내용을 적으면, AI가 행동특성 및 종합의견 문구를 추천해요.<br>
        학생을 누르면 입력 칸이 열려요.</p>
      ${busyNote()}
      ${promptCard('BEHAVIOR_RECORD_PROMPT', '프롬프트 확인')}
      <div class="card row between">
        <div>만들 준비가 된 학생 <b>${ready}</b>명 · 추천 완료 <b>${done}</b>명</div>
        ${toolStartButton('behavior', `추천 문구 만들기 (${ready}명)`, !ready)}
      </div>
      ${statusPanel('behavior', '명')}

      <div class="toolbar">
        <input type="search" id="search" class="grow" placeholder="학생 이름으로 찾기" value="${esc(S.filters.search)}">
        <button class="btn" data-action="add-behavior-students">학생 추가</button>
        <button class="btn" data-action="reload-behavior">새로고침</button>
        ${d.rows.length ? downloadButton('behavior') : ''}
        ${done ? toolDeleteButton('clear-behavior-results', '추천 문구 모두 지우기') : ''}
        ${d.rows.length ? toolDeleteButton('delete-all-behavior', '학생 모두 삭제') : ''}
      </div>
      ${d.rows.length === 0 ? `<div class="card empty">아직 학생이 없어요.<br>[학생 추가]를 눌러 이름을 넣어 주세요.</div>` : `
      <div class="list">${rows.map(r => {
        if (S.bDraft && S.bDraft.row === r.row) return behaviorEditor(r);
        const st = behaviorState(r);
        const traits = splitTraits(r.selectedTraits).concat(splitTraits(r.customTraits));
        return `
          <div class="item clickable" data-action="open-behavior" data-id="${r.row}">
            <b style="min-width:90px">${esc(r.studentName || '(이름 없음)')}</b>
            <span class="grow muted small ellipsis">${traits.length ? esc(traits.join(', ')) : '특성 없음'}${r.recommendedRecord ? ` · ${esc(String(r.recommendedRecord).slice(0, 60))}…` : ''}</span>
            <span class="pill ${st.cls}">${esc(st.label)}</span>
          </div>`;
      }).join('')}</div>`}`;
  }

  // ---- 수동추가 --------------------------------------------------------------
  function manualSetupCard(d, open) {
    const columns = d.headers.slice();
    // 출력 열은 아직 비어 있는 오른쪽 열도 고를 수 있게 한다.
    for (let i = 0; i < 2; i++) {
      const col = columns.length + 1;
      columns.push({ col, letter: columnLetter(col), name: '' });
    }
    const label = c => `${c.letter}${c.name ? ` · ${c.name}` : ' (빈 열)'}`;

    return `
      <details class="card" ${open ? 'open' : ''}>
        <summary><b>열 설정</b> <span class="muted small">${d.configured
          ? `AI에 보낼 열 ${d.inputCols.map(columnLetter).join(', ')} → 생기부 열 ${columnLetter(d.outputCol)} (오른쪽 열에 바이트)`
          : '아직 설정하지 않았어요'}</span></summary>
        <p class="muted small">'수동추가' 시트의 어느 열을 AI에게 보내고, 결과를 어느 열에 적을지 골라요.</p>
        <div class="save-warn" style="margin:8px 0 12px">⚠️ 이름·학번·이메일처럼 개인정보가 담긴 열은 AI에게 보내지 마세요.</div>
        <div class="field"><span>AI에게 보낼 열 (여러 개 가능)</span>
          <div class="chips">${d.headers.filter(c => c.name && (!d.outputCol || (c.col !== d.outputCol && c.col !== d.outputCol + 1))).map(c => `
            <label class="chip ${d.inputCols.includes(c.col) ? 'on' : ''}"><input type="checkbox" class="manual-input-col" value="${c.col}" ${d.inputCols.includes(c.col) ? 'checked' : ''}> ${esc(label(c))}</label>`).join('')}</div></div>
        <div class="row">
          <label class="field"><span>생기부를 적을 열</span>
            <select id="manual-output-col"><option value="">고르세요</option>
              ${columns.map(c => `<option value="${c.col}" ${d.outputCol === c.col ? 'selected' : ''}>${esc(label(c))}</option>`).join('')}</select></label>
          <label class="field" style="width:120px"><span>데이터 시작 행</span>
            <input type="number" id="manual-start-row" min="2" value="${esc(d.startRow || 2)}"></label>
          <button class="btn primary" data-action="save-manual-setup" style="margin-top:10px">열 설정 저장</button>
        </div>
        ${d.configError && !d.configured ? `<div class="help">${esc(d.configError)}</div>` : ''}
      </details>`;
  }

  function columnLetter(col) {
    let letter = '';
    while (col > 0) {
      const t = (col - 1) % 26;
      letter = String.fromCharCode(65 + t) + letter;
      col = Math.floor((col - t - 1) / 26);
    }
    return letter;
  }

  function manualAddCard(d) {
    const cols = d.headers.filter(c => c.name && c.col !== d.outputCol && c.col !== d.outputCol + 1);
    return `
      <details class="card">
        <summary><b>한 줄 직접 추가</b> <span class="muted small">빠진 학생을 한 명씩 더할 때 써요.</span></summary>
        ${cols.map(c => `
          <label class="field"><span>${esc(c.name)}</span>
            ${d.inputCols.includes(c.col)
              ? `<textarea class="manual-new" data-col="${c.col}" rows="3"></textarea>`
              : `<input type="text" class="manual-new" data-col="${c.col}">`}</label>`).join('')}
        <div class="row" style="justify-content:flex-end"><button class="btn primary" data-action="add-manual-row">추가</button></div>
      </details>`;
  }

  // ---- CSV 올리기 -----------------------------------------------------------
  const PERSONAL_COL = /번호|이름|성명|학번|이메일|e-?mail|성별|^반$|학년|타임스탬프|timestamp/i;

  function manualUploadCard(d) {
    const c = S.csv;
    if (!c) {
      return `
        <p class="source-intro">데이터를 가져올 방법을 하나 고르세요. 어느 쪽이든 '수동추가' 시트가 만들어져요.</p>
        <div class="source-pick">
          <section class="source source-file">
            <div class="source-head">
              <span class="source-badge">1</span>
              <div><h3>파일 올리기</h3><p>엑셀(.xlsx, .xls) · CSV · TSV</p></div>
            </div>
            <label class="dropzone ${S.busy ? 'disabled' : ''}" id="manual-drop">
              <input type="file" id="manual-csv" accept="${UPLOAD_ACCEPT}" ${S.busy ? 'disabled' : ''}>
              ${S.csvLoading
                ? '<span class="drop-icon"><span class="spinner"></span></span><b>파일을 읽는 중…</b>'
                : '<span class="drop-icon">⬆</span><b>파일을 끌어다 놓거나 눌러서 고르기</b><span class="small muted">첫 줄이 열 이름인 표여야 해요</span>'}
            </label>
          </section>
          <div class="source-or" aria-hidden="true"><span>또는</span></div>
          <section class="source source-form">
            <div class="source-head">
              <span class="source-badge">2</span>
              <div><h3>구글 설문 응답 시트</h3><p>링크만 붙여 넣으면 내려받지 않고 바로 가져와요</p></div>
            </div>
            <div class="url-field">
              <input type="text" id="manual-url" placeholder="docs.google.com/spreadsheets/d/… 주소" value="${esc(S.manualUrl !== undefined ? S.manualUrl : (d.formUrl || ''))}" ${S.busy ? 'disabled' : ''}>
              <button class="btn primary" data-action="fetch-manual-url" ${S.busy ? 'disabled' : ''}>가져오기</button>
            </div>
            <ol class="source-steps">
              <li>설문지 편집 화면의 <b>[응답]</b> 탭 → <b>[스프레드시트에서 보기]</b></li>
              <li>열린 시트의 주소를 복사해 위에 붙여 넣기 <span class="muted">(이 계정으로 열 수 있는 시트)</span></li>
            </ol>
            <div class="help">나중에 들어온 응답은 <b>[설문 새 응답 가져오기]</b>로 이어 붙여요. 이미 가져온 응답을 설문에서 고친 것은 반영되지 않아요.</div>
          </section>
        </div>`;
    }

    const preview = c.rows.slice(0, 3);
    const cut = v => { v = String(v || ''); return v.length > 40 ? v.slice(0, 40) + '…' : v; };
    return `
      <div class="row between"><h2 style="margin:0">${esc(c.fileName)}</h2><span class="muted">${c.rows.length}행 · ${c.headers.length}열</span></div>
      ${c.sheets && c.sheets.length > 1 ? `
        <label class="field" style="margin:12px 0 0"><span>사용할 시트</span>
          <select id="csv-sheet">${c.sheets.map(name => `<option ${name === c.sheetName ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select></label>` : ''}
      <div class="field" style="margin-top:14px"><span>AI에게 보낼 열 (여러 개 가능)</span>
        <div class="chips">${c.headers.map((h, i) => `
          <label class="chip ${c.inputCols.includes(i + 1) ? 'on' : ''}"><input type="checkbox" class="csv-input-col" value="${i + 1}" ${c.inputCols.includes(i + 1) ? 'checked' : ''}> ${esc(h || `${columnLetter(i + 1)}열`)}</label>`).join('')}</div>
        <div class="help">활동 내용이 담긴 열을 고르세요.</div>
        <div class="save-warn" style="margin-top:8px">⚠️ 이름·학번·이메일처럼 개인정보가 담긴 열은 AI에게 보내지 마세요.${c.fromUrl ? ' 구글 설문의 <b>이메일 주소</b> 열도 마찬가지예요.' : ''}</div></div>
      <div class="table-wrap" style="max-height:200px;margin-bottom:12px"><table>
        <tr>${c.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr>
        ${preview.map(r => `<tr>${c.headers.map((_, i) => `<td class="small">${esc(cut(r[i]))}</td>`).join('')}</tr>`).join('')}
      </table></div>
      ${d.exists ? `<div class="help" style="margin-bottom:10px">이미 '수동추가' 시트가 있어요. 만들 때 덮어쓸지, 지금 시트를 백업으로 남길지 물어볼게요.${c.fromUrl ? ' 지금 시트에 없는 새 응답만 붙이려면 <b>[새 응답만 이어 붙이기]</b>를 누르세요.' : ''}</div>` : ''}
      <div class="row" style="justify-content:flex-end">
        <button class="btn" data-action="cancel-csv">다른 파일 고르기</button>
        ${d.exists && c.fromUrl ? `<button class="btn" data-action="append-manual-rows" ${S.busy ? 'disabled' : ''}>새 응답만 이어 붙이기</button>` : ''}
        <button class="btn primary" data-action="import-manual-csv" ${S.busy ? 'disabled' : ''}>이 내용으로 시트 만들기</button>
      </div>`;
  }

  // 구글이 화면 코드의 '//' 뒤를 주석으로 잘라 내는 경우가 있어서 URL의 슬래시는 \/로 쓴다.
  const UPLOAD_ACCEPT = '.xlsx,.xls,.csv,.tsv,.txt';
  // SheetJS 0.18.5에 셀 서식(자동 줄바꿈) 저장을 더한 판. 읽기는 원래 SheetJS와 같다.
  const SHEETJS_URL = 'https:\/\/cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';

  // 엑셀 파일을 읽는 라이브러리는 엑셀을 고를 때만 불러온다.
  function loadSheetJs() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = SHEETJS_URL;
      script.onload = () => resolve(window.XLSX);
      script.onerror = () => reject(new Error('엑셀 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인하거나 CSV로 저장해 올려 주세요.'));
      document.head.appendChild(script);
    });
  }

  // ---- 엑셀로 받기 (초안 · 합친 생기부 · 공통문구 · 행발 · 수동추가 공용) ---------------
  function downloadButton(kind) {
    return `<button class="btn download" data-action="download" data-kind="${kind}" ${S.busy ? 'disabled' : ''}>⬇ 엑셀로 받기</button>`;
  }

  function saveBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  function csvText(table) {
    const cell = v => {
      const s = String(v === null || v === undefined ? '' : v);
      return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    return table.map(r => r.map(cell).join(',')).join('\r\n');
  }

  // 서버에서 시트 전체를 받아 엑셀 파일로 저장한다. 엑셀 도구를 못 불러오면 CSV로 저장한다.
  async function downloadExport(kind) {
    const data = await call('uiExportData', kind);
    if (!data.rows.length) return banner('받을 내용이 아직 없어요.', 'err');

    const headers = data.headers.slice();
    let rows = data.rows;
    const textCol = data.textCol === undefined ? -1 : data.textCol;
    if (textCol >= 0) {
      headers.push('바이트');
      rows = rows.map(r => r.concat(neisBytes(String(r[textCol] || ''))));
    }
    const table = [headers].concat(rows);
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const base = `${data.fileName}_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;

    try {
      const XLSX = await loadSheetJs();
      const ws = XLSX.utils.aoa_to_sheet(table);
      ws['!cols'] = headers.map((h, i) => ({
        wch: i === textCol ? 80 : Math.min(40, Math.max(6, ...table.map(r => String(r[i] === undefined ? '' : r[i]).length + 2))),
      }));
      // 모든 칸을 자동 줄바꿈 · 위쪽 정렬로, 첫 줄(열 이름)은 굵게
      Object.keys(ws).filter(addr => addr[0] !== '!').forEach(addr => {
        ws[addr].s = { alignment: { wrapText: true, vertical: 'top' } };
        if (XLSX.utils.decode_cell(addr).r === 0) ws[addr].s.font = { bold: true };
      });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, data.fileName.slice(0, 31));
      XLSX.writeFile(wb, `${base}.xlsx`);
    } catch (err) {
      saveBlob(new Blob(['﻿' + csvText(table)], { type: 'text/csv;charset=utf-8' }), `${base}.csv`);
    }
    banner(`${rows.length}개를 파일로 저장했어요. 브라우저의 다운로드 폴더를 확인하세요.`, 'ok');
  }

  async function readUploadFile(file) {
    const ext = (file.name.match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();
    const buf = await file.arrayBuffer();
    if (ext === 'xlsx' || ext === 'xls' || ext === 'xlsm') {
      const XLSX = await loadSheetJs();
      const book = XLSX.read(buf, { type: 'array' });
      const sheets = book.SheetNames.filter(name => {
        const ws = book.Sheets[name];
        return ws && ws['!ref'];
      });
      if (!sheets.length) throw new Error('엑셀 파일에 내용이 있는 시트가 없어요.');
      return { book, sheets, sheetName: sheets[0], table: sheetToTable(XLSX, book, sheets[0]) };
    }
    if (['csv', 'tsv', 'txt'].includes(ext)) return { table: readCsvBuffer(buf) };
    throw new Error('엑셀(.xlsx, .xls) 또는 CSV 파일만 올릴 수 있어요.');
  }

  // 구글 설문 응답 시트 링크를 서버에서 엑셀 파일로 받아, 파일을 올렸을 때와 같은 모양(S.csv)으로 만든다.
  async function readSheetFromUrl(url) {
    const res = await call('uiFetchSheetFromUrl', url);
    const bin = atob(res.base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (res.kind === 'csv') return Object.assign({ fileName: res.name, fromUrl: url }, csvTable(readCsvBuffer(bytes.buffer)));
    const XLSX = await loadSheetJs();
    const book = XLSX.read(bytes, { type: 'array' });
    const sheets = book.SheetNames.filter(name => book.Sheets[name] && book.Sheets[name]['!ref']);
    if (!sheets.length) throw new Error('가져온 시트에 내용이 없어요.');
    const sheetName = sheets.find(name => /^(설문지 응답|Form Responses)/i.test(name)) || sheets[0];
    return Object.assign({ fileName: res.name, fromUrl: url, book, sheets, sheetName }, csvTable(sheetToTable(XLSX, book, sheetName)));
  }

  function sheetToTable(XLSX, book, name) {
    const rows = XLSX.utils.sheet_to_json(book.Sheets[name], { header: 1, raw: false, defval: '' });
    return tableFromRows(rows);
  }

  // 엑셀에서 저장한 CSV는 EUC-KR(CP949)인 경우가 많아서, UTF-8로 안 읽히면 EUC-KR로 다시 읽는다.
  function readCsvBuffer(buf) {
    let text;
    try {
      text = new TextDecoder('utf-8', { fatal: true }).decode(buf);
    } catch (err) {
      text = new TextDecoder('euc-kr').decode(buf);
    }
    return parseCsv(text.replace(/^\uFEFF/, ''));
  }

  function parseCsv(text) {
    const firstLine = text.split(/\r?\n/, 1)[0] || '';
    const delim = (firstLine.match(/\t/g) || []).length > (firstLine.match(/,/g) || []).length ? '\t' : ',';
    const rows = [];
    let row = [], field = '', quoted = false;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (ch === '"') quoted = false;
        else field += ch;
      } else if (ch === '"' && field === '') {
        quoted = true;
      } else if (ch === delim) {
        row.push(field); field = '';
      } else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else {
        field += ch;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return tableFromRows(rows);
  }

  function tableFromRows(rows) {
    const data = rows.filter(r => r.some(v => String(v).trim() !== ''));
    if (data.length < 2) throw new Error('첫 줄에 열 이름, 그 아래에 데이터가 있어야 해요.');
    const width = Math.max.apply(null, data.map(r => r.length));
    const headers = Array.from({ length: width }, (_, i) => String(data[0][i] || '').trim());
    return { headers, rows: data.slice(1).map(r => headers.map((_, i) => String(r[i] == null ? '' : r[i]).trim())) };
  }

  // 개인정보로 보이지 않는 열 중 글이 긴 열을 AI에게 보낼 열로 미리 골라 둔다.
  function guessInputCols(headers, rows) {
    const avg = headers.map((_, i) => rows.reduce((sum, r) => sum + String(r[i] || '').length, 0) / Math.max(rows.length, 1));
    const candidates = headers.map((h, i) => i).filter(i => !PERSONAL_COL.test(headers[i]));
    const long = candidates.filter(i => avg[i] >= 15);
    if (long.length) return long.map(i => i + 1);
    const best = candidates.sort((a, b) => avg[b] - avg[a])[0];
    return best === undefined ? [] : [best + 1];
  }

  function csvTable(table) {
    return { headers: table.headers, rows: table.rows, inputCols: guessInputCols(table.headers, table.rows) };
  }

  // ---- 프롬프트 확인 카드 (초안 · 초안 합치기 · 수동추가 공용) ------------------------
  // 프롬프트 맨 위 [교사 안내]/[자료 안내]의 '- 항목: 값' 줄을 읽는다.
  // '(선택)'이 붙은 줄은 비워도 되고, 안내 제목 줄에 '(선택)'이 있으면 모든 줄을 비워도 된다.
  function promptInfo(text) {
    const lines = String(text || '').split('\n');
    const head = lines.findIndex(l => /^\[(교사|자료) 안내\]/.test(l.trim()));
    if (head < 0) return [];
    const allOptional = lines[head].includes('(선택)');
    const items = [];
    for (let i = head + 1; i < lines.length && lines[i].trim(); i++) {
      const m = lines[i].match(/^- ([^:]+):(.*)$/);
      if (m) items.push({ label: m[1].trim(), value: m[2].trim(), optional: allOptional || m[1].includes('(선택)') });
      // '- 항목:' 다음 줄에 이어 쓴 번호 목록 등도 그 항목의 값으로 본다.
      else if (items.length) { const last = items[items.length - 1]; last.value = `${last.value} ${lines[i].trim()}`.trim(); }
    }
    return items;
  }

  function promptMissingInfo(text) {
    return promptInfo(text).some(item => !item.optional && !item.value);
  }

  function savedPrompt(key) {
    const item = S.settings && S.settings.groups.prompts.find(x => x.key === key);
    const value = item ? String(item.value || '').trim() : '';
    return value || ((S.settings && S.settings.defaults && S.settings.defaults[key]) || '');
  }

  function currentPrompt(key) {
    return S.promptEdits[key] !== undefined ? S.promptEdits[key] : savedPrompt(key);
  }

  function promptDirty(key) {
    return S.promptEdits[key] !== undefined && S.promptEdits[key] !== savedPrompt(key);
  }

  // 프롬프트 카드에 따로 보여 주는 예시. [이 예시로 채우기]를 누르면 그대로 옮겨 온다.
  const PROMPT_EXAMPLES = {

      '이때 스프레드시트로 저장할 수 있는 표 형태로 추출한다.',
      '',

      '1. 학생이 손으로 쓴 글만 옮긴다.',
      '2. 보이는 그대로 옮긴다. 맞춤법을 고치거나, 요약하거나, 없는 내용을 보태지 않는다.',
      '3. 읽을 수 없는 글자나 낱말은 [?]로 적는다. 짐작이 가더라도 확실하지 않으면 [?]로 적는다.',
      '4. 줄을 바꾼 곳과 문단은 줄바꿈으로 살린다. 줄을 그어 지운 글은 옮기지 않는다.',
    ].join('\n'),
    PROMPT_1: [
      '[교사 안내] (선택)',
      '- 과목/작성 영역: 인공지능 기초',

    ].join('\n'),
    PROMPT_2: [
      '[교사 안내] (선택)',
      '- 과목/작성 영역: 인공지능 기초',
      '- 강조할 점: 과제 1과 과제 2에서 유지되는 학생의 논리적 일관성',
      '- 작성 순서/형식:',
      '1. 과제 1에 대한 초안과 과제 2의 초안을 자연스럽게 이어붙인다.',
      '2. 이때 달라지는 상황에 따라 학생의 판단이 일관성을 가지는지 비교하여 그를 강조한다.',
      '',
      '[작성 원칙]',
      '1. [교사 안내]의 과목/작성 영역에 맞는 어휘와 관점으로 쓰고, 작성 순서/형식이 있으면 그대로 따른다.',
      '2. 강조할 점은 과제별 근거가 있을 때만 반영한다.',
      '3. 여러 과제를 단순 나열하지 말고, 학생의 수행 특성이 자연스럽게 드러나도록 종합한다.',
    ].join('\n'),
  };

  function promptExample(key) {
    const example = PROMPT_EXAMPLES[key];
    if (!example) return '';
    return `
      <details class="prompt-example" ${S.promptExampleOpen[key] ? 'open' : ''} data-prompt-example="${key}">
        <summary>작성 예시 보기</summary>
        <pre>${esc(example)}</pre>
        <div class="row" style="justify-content:flex-end">
          <button class="btn" data-action="use-prompt-example" data-key="${key}">이 예시로 채우기</button>
        </div>
      </details>`;
  }

  // 안내 줄이 없는 프롬프트(행발)는 summary·설명 문구를 따로 쓴다.
  const PROMPT_CARD_TEXT = {
    OCR_PROMPT: {
      summary: '⚠️ [추출 내용 및 방법]을 이번 과제에 맞게 꼭 고쳐 주세요.',
      help: 'AI가 스캔한 과제를 옮겨 적을 때 따르는 지침이에요. [추출 내용 및 방법]에 적은 항목이 표의 열이 되니, 과제지의 문항을 줄이지 말고 통째로 적어 주세요. 열 이름이 생기부를 쓸 때 AI에게 함께 가서, 무엇을 물었는지 알고 써요. 항목은 하나씩 "큰따옴표"로 감싸고 쉼표로 나눠 주세요. 그러면 문항 안에 쉼표가 있어도 정확히 나눠요. 학번·이름은 늘 따로 옮겨 적어요. “스프레드시트로 저장할 수 있는 표 형태로 추출한다”는 문장은 지워도 AI에게 늘 함께 보내요.',
    },
    BEHAVIOR_RECORD_PROMPT: {
      summary: '작성 스타일에 맞게 고쳐 쓸 수 있어요.',
      help: 'AI가 행발 문구를 쓸 때 따르는 지침이에요. 학생별 특성·관찰 내용과 글자수는 여기에 없어도 자동으로 함께 보내져요.',
    },
    GRADING_GUIDE: {
      summary: '"매우 관대하게 채점한다"처럼 채점 태도를 적을 수 있어요.',
      help: '모든 과제의 채점에 적용되는 지침이에요. 과제별 채점 기준과 학생 제출물은 여기에 없어도 자동으로 함께 보내져요.',
    },
  };

  function promptCard(key, title) {
    if (!S.settings) return '';
    const text = currentPrompt(key);
    const dirty = promptDirty(key);
    const missing = promptMissingInfo(text) || (key === 'OCR_PROMPT' && text.includes('(여기에'));
    const filled = promptInfo(text).filter(item => item.value).map(item => item.value);
    const custom = PROMPT_CARD_TEXT[key];
    const pill = missing ? '<span class="pill warn">안내를 채워 주세요</span>'
      : dirty ? '<span class="pill warn">저장 안 함</span>' : '<span class="pill ok">저장됨</span>';
    return `
      <details class="card prompt-card ${missing ? 'hero' : ''}" data-prompt-card="${key}" ${missing || dirty || S.promptOpen[key] ? 'open' : ''}>
        <summary>
          <span class="prompt-card-icon" aria-hidden="true">📝</span>
          <span class="prompt-card-head">
            <span class="prompt-card-title">${esc(title)} ${pill}</span>
            <span class="muted small">${filled.length ? esc(filled.join(' · ')) : custom ? custom.summary : '과목이나 작성 영역을 적어 주면 결과가 좋아져요.'}</span>
          </span>
          <span class="prompt-card-toggle"></span>
        </summary>
        <p class="muted small" style="margin:10px 0">${custom ? custom.help : '맨 위 안내 줄에 과목·작성 영역을 적어 주세요. 과제 정보, 학생 제출물, 글자수, 점수 규칙은 여기에 없어도 자동으로 함께 보내져요.'}
          설정 화면의 프롬프트와 같은 값이에요.</p>
        <div class="tip">처음부터 완벽하게 쓰지 않아도 돼요. <b>몇 개만 먼저 만들어 보고, 결과를 보며 프롬프트를 고쳐 다시 만들면</b> 점점 원하는 문장에 가까워져요.${key === 'BEHAVIOR_RECORD_PROMPT' ? '<br>결과가 마음에 들지 않으시면 <b>[보완점 돌려 쓰기] 및 예시</b>를 수정해주시면 좋습니다.' : ''}</div>
        ${promptExample(key)}
        <textarea data-prompt-key="${key}" rows="12">${esc(text)}</textarea>
        <div class="row" style="justify-content:flex-end;margin-top:8px">
          <span class="save-warn inline${dirty ? '' : ' hidden'}" data-prompt-warn="${key}">저장하지 않았어요. [프롬프트 저장]을 눌러야 반영돼요.</span>
          ${key === 'BEHAVIOR_RECORD_PROMPT'
            ? `<button class="btn" data-action="reset-prompt" data-key="${key}" data-variant="light">기본 프롬프트로 바꾸기(가벼운 말투)</button>
          <button class="btn" data-action="reset-prompt" data-key="${key}">기본 프롬프트로 바꾸기(진지한 말투)</button>`
            : `<button class="btn" data-action="reset-prompt" data-key="${key}">기본 프롬프트로 바꾸기</button>`}
          <button class="btn primary" data-action="save-prompt" data-key="${key}" ${dirty ? '' : 'disabled'}>프롬프트 저장</button>
        </div>
      </details>
      ${lengthCard(key)}`;
  }

  // 프롬프트별 분량 기준(나이스 바이트): [최소 키, 최대 키, 기본 최소, 기본 최대, 카드 제목 앞부분]
  const LENGTH_SETTINGS = {
    PROMPT_1: ['RECORD_DRAFT_MIN_BYTES', 'RECORD_DRAFT_MAX_BYTES', 900, 1200, '초안을'],
    PROMPT_2: ['FINAL_RECORD_MIN_BYTES', 'FINAL_RECORD_MAX_BYTES', 900, 1200, '합친 생기부를'],
    MANUAL_PROMPT: ['MANUAL_RECORD_MIN_BYTES', 'MANUAL_RECORD_MAX_BYTES', 900, 1200, '생기부를'],
    BEHAVIOR_RECORD_PROMPT: ['BEHAVIOR_RECORD_MIN_BYTES', 'BEHAVIOR_RECORD_MAX_BYTES', 750, 1200, '행발 문구를'],
  };

  function savedLength(key, fallback) {
    const item = S.settings && S.settings.groups.lengths.find(x => x.key === key);
    const value = item ? String(item.value || '').trim() : '';
    return value || String(fallback);
  }

  function currentLength(key, fallback) {
    return S.lengthEdits[key] !== undefined ? S.lengthEdits[key] : savedLength(key, fallback);
  }

  function lengthDirty(promptKey) {
    const l = LENGTH_SETTINGS[promptKey];
    return !!l && [[l[0], l[2]], [l[1], l[3]]].some(([key, fallback]) =>
      S.lengthEdits[key] !== undefined && String(S.lengthEdits[key]).trim() !== savedLength(key, fallback));
  }

  // 한글 생기부는 공백을 섞어 1자에 약 2.7바이트다 (Code.js의 approxCharsFromBytes_와 같은 계산).
  function lengthHint(promptKey) {
    const l = LENGTH_SETTINGS[promptKey];
    const min = Number(currentLength(l[0], l[2]));
    const max = Number(currentLength(l[1], l[3]));
    if (!(min > 0 && max > 0)) return '숫자를 적어 주세요';
    if (min > max) return '앞의 숫자가 더 커요';
    return `공백 포함 약 ${Math.round(min / 2.7)}~${Math.round(max / 2.7)}자`;
  }

  function lengthError(promptKey) {
    const l = LENGTH_SETTINGS[promptKey];
    const min = String(currentLength(l[0], l[2])).trim();
    const max = String(currentLength(l[1], l[3])).trim();
    if (!/^[1-9][0-9]{0,4}$/.test(min) || !/^[1-9][0-9]{0,4}$/.test(max)) return '분량은 1 이상의 숫자로 적어 주세요.';
    if (Number(min) > Number(max)) return '분량의 최소 바이트가 최대 바이트보다 커요.';
    return '';
  }

  function lengthCard(promptKey) {
    const l = LENGTH_SETTINGS[promptKey];
    if (!l || !S.settings) return '';
    const dirty = lengthDirty(promptKey);
    const input = (key, fallback) =>
      `<input type="number" class="length-input" min="1" step="50" data-length-key="${key}" data-length-prompt="${promptKey}" value="${esc(currentLength(key, fallback))}">`;
    return `
      <div class="card length-card">
        <div class="length-card-head">
          <span class="prompt-card-icon" aria-hidden="true">📏</span>
          <div>
            <div class="prompt-card-title">${esc(l[4])} 몇 바이트로 받아볼까요?</div>
            <div class="muted small">나이스 바이트 기준이에요. 한글 1자는 3바이트, 공백·영문·숫자는 1바이트로 세요. 10% 넘게 벗어나면 AI에 한 번 다시 요청해요.</div>
            <div class="muted small">AI는 글자 수를 정확히 세지 못해서, 다시 요청해도 범위를 조금 벗어날 수 있어요. 그럴 때는 확인할 점에 바이트 수를 적어 두니, 나이스에 옮기기 전에 확인하고 다듬어 주세요.</div>
          </div>
        </div>
        <div class="length-card-inputs">
          ${input(l[0], l[2])} <span>바이트 이상</span>
          ${input(l[1], l[3])} <span>바이트 이하</span>
          <span class="muted small" data-length-hint="${promptKey}">${esc(lengthHint(promptKey))}</span>
          <span class="grow"></span>
          <button class="btn" data-action="save-length" data-key="${promptKey}" ${dirty ? '' : 'disabled'}>분량 저장</button>
        </div>
      </div>`;
  }

  // 프롬프트·분량 저장은 화면에 먼저 반영하고 서버 저장은 뒤에서 한다. 실패하면 입력한 내용을 되살린다.
  // 만들기를 누르면 preparePrompt가 진행 중인 저장을 기다린 뒤 시작하므로 예전 프롬프트로 만들지 않는다.
  let settingSave = Promise.resolve();

  function applySettingValues(patch) {
    const before = {};
    Object.keys(patch).forEach(key => {
      for (const group of Object.values(S.settings.groups)) {
        const item = group.find(x => x.key === key);
        if (item) { before[key] = item.value; item.value = String(patch[key]); }
      }
    });
    return before;
  }

  function saveSettingValues(patch, edits, editKeys) {
    const before = applySettingValues(patch);
    const kept = {};
    editKeys.forEach(key => { kept[key] = edits[key]; delete edits[key]; });
    const saving = settingSave.catch(() => {}).then(() => call('uiSaveSettingValues', patch)).catch(err => {
      applySettingValues(before);
      // 그사이 다시 고친 내용이 없을 때만 되살린다.
      editKeys.forEach(key => { if (edits[key] === undefined && kept[key] !== undefined) edits[key] = kept[key]; });
      throw err;
    });
    settingSave = saving;
    // 저장이 끝나기 전에 창을 닫으려 하면 beforeunload에서 묻는다.
    S.settingSaving = (S.settingSaving || 0) + 1;
    saving.catch(() => {}).then(() => { S.settingSaving--; });
    return saving;
  }

  function saveLength(promptKey) {
    const l = LENGTH_SETTINGS[promptKey];
    const error = lengthError(promptKey);
    if (error) return Promise.reject(new Error(error));
    return saveSettingValues({
      [l[0]]: String(currentLength(l[0], l[2])).trim(),
      [l[1]]: String(currentLength(l[1], l[3])).trim(),
    }, S.lengthEdits, [l[0], l[1]]);
  }

  function handleLengthInput(el) {
    const key = el.dataset.lengthKey;
    if (!key) return false;
    const promptKey = el.dataset.lengthPrompt;
    S.lengthEdits[key] = el.value;
    const hint = document.querySelector(`[data-length-hint="${promptKey}"]`);
    if (hint) hint.textContent = lengthHint(promptKey);
    const btn = document.querySelector(`[data-action="save-length"][data-key="${promptKey}"]`);
    if (btn) btn.disabled = !lengthDirty(promptKey);
    return true;
  }

  function savePrompt(key) {
    return saveSettingValues({ [key]: S.promptEdits[key] }, S.promptEdits, [key]);
  }

  // 뒤에서 저장하다 실패하면 입력 내용을 되살리고 알린다.
  function saveInBackground(saving, message) {
    render();
    banner(message, 'ok');
    saving.catch(err => {
      if (!isEditing()) render();
      showError(err);
    });
  }

  // 만들기 전에: 안내가 비어 있으면 한 번 묻고, 저장하지 않은 프롬프트는 저장한다.
  async function preparePrompt(key) {
    if (!S.settings) S.settings = await call('uiGetSettings');
    // 뒤에서 저장 중인 프롬프트가 있으면 끝난 뒤에 확인한다. 실패했으면 아래에서 다시 저장한다.
    await settingSave.catch(() => render());
    if (lengthDirty(key) && lengthError(key)) {
      banner(lengthError(key), 'err');
      return false;
    }
    if (promptMissingInfo(currentPrompt(key)) &&
      !await confirmModal('프롬프트 안내가 비어 있어요', "프롬프트 맨 위의 과목·작성 영역을 채우면 결과가 훨씬 좋아져요.\nAI가 어떤 글을 써야 할지 모르면 어색한 결과가 나올 수 있어요.\n그대로 만들까요?", '그대로 만들기')) return false;
    if (promptDirty(key)) await savePrompt(key);
    if (lengthDirty(key)) await saveLength(key);
    return true;
  }

  function handlePromptInput(el) {
    const key = el.dataset.promptKey;
    if (!key) return false;
    S.promptEdits[key] = el.value;
    const btn = document.querySelector(`[data-action="save-prompt"][data-key="${key}"]`);
    if (btn) btn.disabled = !promptDirty(key);
    const warn = document.querySelector(`[data-prompt-warn="${key}"]`);
    if (warn) warn.classList.toggle('hidden', !promptDirty(key));
    return true;
  }

  function manualStatusPill(status) {
    const cls = { '완료': 'ok', '대기': '', '오류': 'err', '근거부족': 'warn', '내용 부족': 'warn' }[status] || '';
    return `<span class="pill ${cls}">${esc(status)}</span>`;
  }

  function viewManual() {
    const d = S.manual;
    if (!d) return '<div class="loading">불러오는 중…</div>';

    if (!d.exists) {
      return `
        <h1>수동추가</h1>
        <p class="lead">Classroom에 없는 활동(동아리, 대회, 프로젝트 등)의 내용을 직접 넣어 생기부를 만들어요.</p>
        ${S.csv ? `<div class="row" style="justify-content:flex-end;margin-bottom:8px">${resetAllButton('manual-reset-all')}</div>` : ''}
        ${busyNote()}
        <div class="card">${manualUploadCard(d)}</div>`;
    }

    const pending = d.pendingCount + d.errorCount;
    const text = S.filters.search.trim().toLowerCase();
    const rows = d.rows.filter(r => !text || `${r.label} ${r.input}`.toLowerCase().includes(text));

    return `
      <h1>수동추가</h1>
      <p class="lead">올린 파일의 각 행 내용을 AI에게 보내 생기부를 만들어요.</p>
      <div class="row" style="justify-content:flex-end;margin-bottom:8px">${resetAllButton('manual-reset-all')}</div>
      ${busyNote()}
      <details class="card" ${S.csv ? 'open' : ''}>
        <summary><b>새 파일 올리기</b> <span class="muted small">다른 엑셀·CSV 파일이나 구글 설문 응답 시트 링크로 '수동추가' 시트를 다시 만들어요.</span></summary>
        ${manualUploadCard(d)}
      </details>
      ${manualSetupCard(d, !d.configured)}
      ${d.configured ? `
        ${manualAddCard(d)}
        ${promptCard('MANUAL_PROMPT', '프롬프트 확인')}
        <div class="card row between">
          <div>만들 행 <b>${pending}</b>개 <span class="muted small">(내용이 20자 이상이고 생기부 열이 빈 행, 오류가 났던 행 포함)</span></div>
          ${toolStartButton('manual', `생기부 만들기 (${pending}행)`, !pending)}
        </div>
        ${statusPanel('manual', '행')}
        <div class="toolbar">
          <input type="search" id="search" class="grow" placeholder="이름이나 내용으로 찾기" value="${esc(S.filters.search)}">
          <button class="btn" data-action="reload-manual">새로고침</button>
          ${d.formUrl ? `<button class="btn" data-action="refresh-manual-form" ${S.busy || jobRunning('manual') ? 'disabled' : ''} title="${esc(d.formUrl)}">설문 새 응답 가져오기</button>` : ''}
          ${d.rows.length ? downloadButton('manual') : ''}
          ${d.rows.some(r => r.output || r.note) ? toolDeleteButton('clear-manual', '생기부 모두 지우기') : ''}
        </div>
        ${d.truncated ? '<div class="help">행이 많아 앞쪽 500행만 보여줘요.</div>' : ''}
        ${rows.length === 0 ? '<div class="card empty">아직 데이터가 없어요. 파일을 올리거나 [한 줄 직접 추가]를 써 주세요.</div>' : rows.map(r => `
          <div class="record">
            <div class="row between">
              <div><b>${esc(r.label || `${r.row}행`)}</b> <span class="muted small">${r.row}행</span></div>
              <div class="row">${manualStatusPill(r.status)}
                ${r.output || r.status === '오류' || r.status === '근거부족' ? toolDeleteButton('reset-manual', '생기부 지우기', r.row) : ''}
                ${toolDeleteButton('delete-manual-row', '행 삭제', r.row)}</div>
            </div>
            <details class="small"><summary class="muted">AI에게 보내는 내용 보기</summary><div class="pre">${esc(r.input) || '<span class="muted">(비어 있음)</span>'}</div></details>
            ${r.output ? resultEditor('manual', r.row, 5) : ''}
            ${r.note && r.status !== '완료' ? `<div class="caution">${esc(r.note)}</div>` : ''}
          </div>`).join('')}` : ''}`;
  }

  // ---- 손글씨 추출 -------------------------------------------------------------
  // 스캔한 PDF는 브라우저에서 학생별로 나눠 한 명씩 서버에 보낸다. 창을 닫으면 멈추고, 끝난 학생은 시트에 남는다.
  // 구글이 화면 코드의 '//' 뒤를 주석으로 잘라 내는 경우가 있어서 URL의 슬래시는 \/로 쓴다.
  const PDF_LIB_URL = 'https:\/\/cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';

  function loadPdfLib() {
    if (window.PDFLib) return Promise.resolve(window.PDFLib);
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = PDF_LIB_URL;
      script.onload = () => resolve(window.PDFLib);
      script.onerror = () => reject(new Error('PDF 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'));
      document.head.appendChild(script);
    });
  }

  const OCR_REASONING_LABELS = {
    none: 'none · 추론 없음 (가장 쌈)',
    low: 'low · 조금 더 생각함 (비용 약 2배)',
    medium: 'medium · 더 많이 생각함 (가장 비쌈)',
  };

  // 학생이 시작하는 쪽 목록(S.ocrStarts)으로 PDF 쪽을 학생별 묶음으로 나눈다. key는 시트의 '쪽' 값('3' 또는 '3-4')이다.
  function ocrGroups() {
    const pdf = S.ocrPdf;
    if (!pdf || !S.ocrStarts) return [];
    const starts = S.ocrStarts;
    return starts.map((from, i) => {
      const to = i + 1 < starts.length ? starts[i + 1] - 1 : pdf.pageCount;
      return { from, to, key: from === to ? String(from) : `${from}-${to}` };
    });
  }

  // '1, 3, 4-6, 9'처럼 적은 시작 쪽을 읽는다. 범위(4-6)는 그 쪽마다 학생이 한 명씩이라는 뜻이다.
  function evenOcrStarts(per, pageCount) {
    const starts = [];
    for (let p = 1; p <= pageCount; p += per) starts.push(p);
    return starts;
  }

  function ocrPagesOf(key) {
    const m = String(key).match(/^(\d+)(?:-(\d+))?$/);
    return m ? { from: Number(m[1]), to: Number(m[2] || m[1]), key: String(key) } : null;
  }

  async function ocrPiece(group) {
    const PDFLib = await loadPdfLib();
    const out = await PDFLib.PDFDocument.create();
    const indices = [];
    for (let p = group.from; p <= group.to; p++) indices.push(p - 1);
    const pages = await out.copyPages(S.ocrPdf.doc, indices);
    pages.forEach(page => out.addPage(page));
    return out.saveAsBase64();
  }

  function ocrUnreadableCount(text) {
    return (String(text || '').match(/\[\?\]/g) || []).length;
  }

  function ocrGuideCard() {
    return `
      <div class="card ocr-guide">
        <h2 style="margin-top:0">사용 안내</h2>
        <ol style="margin:0 0 12px;padding-left:20px;line-height:1.9">
          <li><b>추출 지침을 반드시 이번 과제에 맞게 고치세요.</b> [추출 내용 및 방법]에 적은 항목(예: 학번, 이름, 악곡명, 느낀 점)이 표의 열이 되고, 수동추가로 보낼 때도 그대로 열이 돼요.</li>
          <li>학생 과제를 <b>학생 순서대로</b> 스캔해 PDF 하나로 만드세요. 학생마다 쪽수가 달라도 괜찮아요.</li>
          <li>PDF를 고르고 <b>학생 1명당 쪽수</b>를 적으면 그 쪽수씩 학생을 나눠요. 학생마다 쪽수가 다르면 <b>[AI로 나누기]</b>를 누르세요. AI가 이름·학번을 보고 학생이 바뀌는 쪽을 찾아요.</li>
          <li>먼저 <b>[3명만 시험해 보기]</b>로 몇 명만 추출해 원본과 비교해 보세요. 잘 읽었으면 <b>[남은 학생 모두 추출]</b>을 누르세요. 이미 추출한 학생은 건너뛰어요.</li>
          <li>표에서 틀린 글자를 고친 뒤 <b>[수동추가로 보내기]</b>를 누르면 수동추가에서 바로 생기부를 만들 수 있어요.</li>
        </ol>
        <div class="tip" style="margin-bottom:10px"><b>💡 모델은 이렇게 고르세요.</b> 싼 모델(GPT luna, Claude haiku)은 손글씨를 잘 못 읽어요. 처음부터 <b>GPT terra</b>나 <b>Claude sonnet</b>을 쓰세요.<br>
          그래도 잘못 읽으면 추론을 low → medium으로 올리세요. 추론이 높을수록 잘 읽지만 비용이 늘고 느려져요. 특정 학생만 잘못 읽었다면 그 학생만 <b>[다시 읽기]</b>를 누르세요.</div>
        <div class="save-warn">⚠️ 스캔한 종이에 적힌 이름·학번도 AI에게 함께 전달돼요. 수동추가로 보낸 뒤 생기부를 만들 때는 <b>내용 열만</b> AI에게 보내요.<br>
          ⚠️ AI가 손글씨를 잘못 읽을 수 있어요. 특히 <b>[?] 표시</b>와 <b>확인할 점</b>이 있는 학생은 원본과 꼭 비교해 주세요.</div>
      </div>`;
  }

  function ocrRunNote(run) {
    if (!run) return '';
    const split = run.kind === 'split';
    const unit = split ? '쪽' : '명';
    const doing = split ? '학생별로 나누는 중…' : '읽는 중…';
    const state = run.running ? `${doing} 이 창을 닫으면 멈춰요${split ? '' : '(끝난 학생은 남아요)'}.` : run.stopped ? '멈췄어요.' : '끝났어요.';
    const failed = run.failed ? ` · 실패 ${run.failed}${split ? '묶음' : '명 (다시 추출하면 실패한 학생부터 다시 읽어요)'}` : '';
    return `<div class="help" style="margin-top:8px">${run.running ? '<span class="spinner"></span> ' : ''}${run.done} / ${run.total}${unit} ${state}${failed}</div>`;
  }

  function ocrFileCard(d) {
    const pdf = S.ocrPdf;
    const run = S.ocrRun;
    const running = run && run.running;
    const locked = S.busy || running;
    const promptText = S.settings ? currentPrompt('OCR_PROMPT') : '';
    const needsEdit = promptText.includes('(여기에');
    const columnsFresh = d.items.length && d.columnsPrompt && d.columnsPrompt.trim() === promptText.trim();
    const modelReady = d.catalog && d.catalog.status === 'ok' && d.models.some(m => m.id === d.model);
    const modelSaved = !d.savedModel || d.savedModel === d.model;
    const blocked = d.layoutMismatch || needsEdit || !modelReady || !modelSaved;
    const groups = ocrGroups();
    const doneKeys = new Set(d.rows.filter(r => r.filled).map(r => r.pages));
    const left = groups.filter(g => !doneKeys.has(g.key)).length;
    const modelSelect = `<select id="ocr-model" ${locked || !d.models.length ? 'disabled' : ''}>${modelSelectOptions(d.models, d.model)}</select>`;
    const reasoningSelect = `<select id="ocr-reasoning" ${locked ? 'disabled' : ''}>${d.reasoningOptions.map(o =>
      `<option value="${o}" ${o === d.reasoning ? 'selected' : ''}>${esc(OCR_REASONING_LABELS[o] || o)}</option>`).join('')}</select>`;
    const stopButton = `<button class="btn danger" data-action="ocr-stop" ${run && run.stop ? 'disabled' : ''}>${run && run.stop ? '멈추는 중…' : '멈추기'}</button>`;
    const aiSplit = Object.keys(S.ocrDetected || {}).length > 0;
    const uneven = pdf && !aiSplit && pdf.pageCount % Math.max(1, Number(S.ocrEven) || 1) !== 0;
    const label = g => {
      const info = S.ocrDetected[g.from] || {};
      const who = [info.studentId, info.name].filter(Boolean).join(' ');
      return `<span class="chip ${doneKeys.has(g.key) ? 'on' : ''}">${esc(g.key)}쪽${who ? ` · ${esc(who)}` : ''}</span>`;
    };

    return `
      <div class="card hero">
        <h2 style="margin-top:0">① 스캔한 PDF 고르기</h2>
        <input type="file" id="ocr-file" accept=".pdf,application/pdf" ${locked ? 'disabled' : ''}>
        ${S.ocrLoading ? '<div class="help"><span class="spinner"></span> PDF를 읽는 중…</div>' : ''}
        ${pdf ? `<div class="help">${esc(pdf.fileName)} · 모두 ${pdf.pageCount}쪽</div>` : ''}
      </div>

      <div class="card">
        <h2 style="margin-top:0">② 학생별로 나누기</h2>
        ${!pdf ? '<p class="muted" style="margin:0">PDF를 먼저 골라 주세요.</p>' : `
        <div class="row" style="flex-wrap:wrap;gap:10px;align-items:center">
          <span>학생 1명당</span>
          <input type="number" id="ocr-even" min="1" max="20" value="${esc(S.ocrEven)}" style="width:70px" ${locked ? 'disabled' : ''}>
          <span>쪽</span>
        </div>
        ${aiSplit
          ? `<div class="help">AI가 이름·학번을 보고 나눈 결과예요. 쪽수 칸을 바꾸면 다시 같은 쪽수로 나눠요.</div>`
          : `<div class="help">${uneven ? `<b>${pdf.pageCount}쪽은 ${esc(S.ocrEven)}쪽씩 딱 나눠지지 않아요.</b> ` : ''}학생마다 쪽수가 다르면 아래 <b>[AI로 나누기]</b>를 누르세요.</div>`}
        <div class="row" style="flex-wrap:wrap;gap:10px;margin-top:8px">
          ${running && run.kind === 'split' ? stopButton
            : `<button class="btn" data-action="ocr-split-ai" ${locked || !modelReady || !modelSaved || !d.hasKey ? 'disabled' : ''}>AI로 나누기</button>`}
          <span class="muted small">쪽수가 다를 때만 쓰세요. ③에서 고른 모델로, 추론 없이 4쪽씩 보내요. 글씨 추출보다 비용이 훨씬 적어요.</span>
        </div>
        ${run && run.kind === 'split' ? ocrRunNote(run) : ''}
        ${groups.length ? `<div class="help" style="margin:12px 0 6px">학생 ${groups.length}명으로 나눴어요. 파란 칸은 이미 추출한 학생이에요.</div>
          <div class="chips">${groups.map(label).join('')}</div>` : ''}`}
      </div>

      <div class="card ${groups.length && left ? 'hero' : ''}">
        <h2 style="margin-top:0">③ 글씨 추출</h2>
        <div class="row" style="flex-wrap:wrap">
          <label class="field grow"><span>모델 (${esc(d.provider)})</span>${modelSelect}</label>
          <label class="field grow"><span>추론 수준</span>${reasoningSelect}</label>
          <button class="btn" data-action="ocr-save-model" ${locked || !modelReady ? 'disabled' : ''}>모델 저장</button>
          <button class="btn" data-action="refresh-models" data-id="${d.provider}" ${locked || !d.hasKey ? 'disabled' : ''}>모델 목록 새로고침</button>
        </div>
        ${catalogNote(d.catalog, d.savedModel || d.model)}
        ${!modelSaved ? '<div class="help" role="status">바꾼 모델을 저장한 뒤 추출해 주세요.</div>' : ''}
        <div class="help" style="margin-bottom:10px">${columnsFresh
          ? `표의 열: <b>${['학번', '이름'].concat(d.items.map(it => it.name)).map(esc).join(' · ')}</b> <span class="muted">(추출 지침에서 읽었어요)</span>`
          : '추출을 시작하면 추출 지침에서 표의 열을 먼저 읽어 보여 드려요.'}</div>
        ${needsEdit ? '<div class="save-warn" style="margin-bottom:10px">⚠️ 추출 지침을 아직 과제에 맞게 고치지 않았어요. 위 추출 지침의 [추출 내용 및 방법]을 고치고 저장해 주세요.</div>' : ''}
        ${d.layoutMismatch ? '<div class="save-warn" style="margin-bottom:10px">⚠️ 이미 추출한 결과의 열이 추출 지침의 항목과 달라요. 아래 [결과 모두 지우기]를 누른 뒤 다시 추출해 주세요.</div>' : ''}
        ${d.hasKey ? '' : `<div class="save-warn" style="margin-bottom:10px">⚠️ ${esc(d.provider)} API 키가 없어요. 시작하기에서 키를 먼저 저장해 주세요.</div>`}
        <div class="row between" style="flex-wrap:wrap">
          <span class="muted small">${groups.length ? `아직 추출하지 않은 학생 ${left}명${left < groups.length ? ` (이미 추출한 ${groups.length - left}명은 건너뛰어요)` : ''}` : '학생별로 나누면 추출할 수 있어요.'}</span>
          <div class="row">
            ${running && run.kind === 'extract' ? stopButton : `
              ${left > 3 ? `<button class="btn" data-action="ocr-start" data-limit="3" ${locked || blocked || !d.hasKey ? 'disabled' : ''}>3명만 시험해 보기</button>` : ''}
              <button class="btn primary" data-action="ocr-start" ${!left || locked || blocked || !d.hasKey ? 'disabled' : ''}>남은 학생 모두 추출 (${left}명)</button>`}
          </div>
        </div>
        ${run && run.kind === 'extract' ? ocrRunNote(run) : ''}
      </div>`;
  }

  function ocrRowValue(r) {
    const edit = S.ocrEdits[r.row];
    return edit || { studentId: r.studentId, name: r.name, answers: r.answers };
  }

  function ocrRowCard(r) {
    const edit = S.ocrEdits[r.row];
    const v = ocrRowValue(r);
    const names = Object.keys(r.answers);
    const unread = names.reduce((sum, n) => sum + ocrUnreadableCount(v.answers[n]), 0);
    const running = S.ocrRun && S.ocrRun.running;
    const field = n => `
        <label class="field" style="margin-top:6px"><span>${esc(n)}</span>
          <textarea class="ocr-edit" data-id="${r.row}" data-field="answer" data-item="${esc(n)}" rows="${names.length > 1 ? 4 : 6}" placeholder="학생이 쓴 내용">${esc(v.answers[n] || '')}</textarea></label>`;
    return `
      <div class="record">
        <div class="row between">
          <div><b>${esc(r.pages)}쪽</b> <span class="muted small">${esc(r.model)}</span></div>
          <div class="row">
            ${r.failed ? '<span class="pill warn">읽기 실패</span>' : unread ? `<span class="pill warn">[?] ${unread}곳</span>` : r.note ? '<span class="pill warn">확인할 점</span>' : '<span class="pill ok">읽음</span>'}
            <button class="btn" data-action="ocr-reread" data-id="${r.row}" ${S.busy || running || S.ocr.layoutMismatch ? 'disabled' : ''}>다시 읽기</button>
            ${running ? '' : toolDeleteButton('ocr-delete', '삭제', r.row)}
          </div>
        </div>
        <div class="row" style="margin-top:8px">
          <label class="field"><span>학번</span><input class="ocr-edit" data-id="${r.row}" data-field="studentId" value="${esc(v.studentId)}" style="width:120px"></label>
          <label class="field grow"><span>이름</span><input class="ocr-edit" data-id="${r.row}" data-field="name" value="${esc(v.name)}"></label>
        </div>
        ${names.map(field).join('')}
        ${r.note ? `<div class="caution">${esc(r.note)}</div>` : ''}
        <div class="row" style="justify-content:flex-end;margin-top:6px">
          <button class="btn primary" data-action="ocr-save" data-id="${r.row}" ${edit && !S.ocr.layoutMismatch ? '' : 'disabled'}>고친 내용 저장</button>
        </div>
      </div>`;
  }

  function viewOcr() {
    const d = S.ocr;
    if (!d) return '<div class="loading">불러오는 중…</div>';
    const ready = d.rows.filter(r => r.filled).length;
    const running = S.ocrRun && S.ocrRun.running;

    return `
      <h1>손글씨 추출</h1>
      <p class="lead">종이로 받은 과제를 스캔한 PDF에서 학생별 손글씨를 추출해 표로 만들고, 수동추가로 넘겨 생기부를 만들어요.</p>
      ${running ? '' : `<div class="row" style="justify-content:flex-end;margin-bottom:8px">${resetAllButton('ocr-reset-all')}</div>`}
      ${busyNote()}
      ${ocrGuideCard()}
      <div class="save-warn" style="margin-bottom:12px;font-size:14px">⚠️ <b>추출 지침을 반드시 과제에 맞게 고쳐 주세요.</b> 아래 지침의 [추출 내용 및 방법]에 학번·이름과 추출할 항목을 쉼표로 나눠 적으면, 그 항목이 표의 열이 되고 수동추가로도 그대로 넘어가요.</div>
      ${promptCard('OCR_PROMPT', '추출 지침 (과제에 맞게 고치기)')}
      ${ocrFileCard(d)}
      ${d.rows.length ? `
        <div class="card row between">
          <div>추출한 학생 <b>${ready}</b>명 <span class="muted small">(내용이 있는 학생만 보내요)</span></div>
          <div class="row">
            ${running ? '' : toolDeleteButton('ocr-clear', '결과 모두 지우기')}
            <button class="btn primary" data-action="ocr-send" ${!ready || S.busy || running || d.layoutMismatch ? 'disabled' : ''}>수동추가로 보내기 (${ready}명)</button>
          </div>
        </div>` : ''}
      ${d.rows.length === 0 ? '<div class="card empty">아직 추출한 글이 없어요.</div>' : d.rows.map(ocrRowCard).join('')}`;
  }

  function replaceOcrRow(updated) {
    if (!updated) return;
    const i = S.ocr.rows.findIndex(r => r.row === updated.row);
    if (i >= 0) S.ocr.rows[i] = updated; else S.ocr.rows.push(updated);
  }

  async function ocrExtractGroup(group) {
    const data = await ocrPiece(group);
    const row = await call('uiOcrExtract', { pages: group.key, data, model: S.ocr.model, reasoning: S.ocr.reasoning });
    if (row) delete S.ocrEdits[row.row];
    replaceOcrRow(row);
    return row;
  }

  // 추출 지침에서 표의 열을 읽는다(지침이 그대로면 읽어 둔 열을 쓴다). 열 이름을 '·'로 이어 돌려준다.
  async function ocrPrepareColumns() {
    if (S.settings && currentPrompt('OCR_PROMPT').includes('(여기에')) {
      S.promptOpen.OCR_PROMPT = true;
      render();
      banner('추출 지침의 [추출 내용 및 방법]을 이번 과제에 맞게 먼저 고쳐 주세요. 적은 항목이 표의 열이 돼요.', 'err');
      return '';
    }
    let columns = '';
    await withBusy('추출 지침에서 표의 열을 읽는 중…', async () => {
      const result = await call('uiOcrPrepareColumns', { model: S.ocr.model });
      S.ocr.items = result.items;
      S.ocr.columnsPrompt = result.prompt;
      columns = ['학번', '이름'].concat(result.items.map(it => it.name)).join(' · ');
    });
    return columns;
  }

  function findOcrRow(id) {
    return (S.ocr.rows || []).find(r => r.row === Number(id));
  }

  async function ocrSaveEdit(id) {
    const r = findOcrRow(id);
    const edit = S.ocrEdits[id];
    if (!r || !edit) return;
    const updated = await call('uiOcrUpdateRow', r.row, r.pages, edit);
    delete S.ocrEdits[id];
    replaceOcrRow(updated);
  }

  // ---- 채점 -----------------------------------------------------------------
  function gradingAssignment() {
    const list = (S.grading && S.grading.assignments) || [];
    return list.find(a => a.key === S.gradingKey) || list[0] || null;
  }

  function gradingRows() {
    const a = gradingAssignment();
    const text = S.filters.search.trim().toLowerCase();
    return ((S.grading && S.grading.rows) || []).filter(r =>
      a && r.assignmentKey === a.key && (!text || `${r.studentNo} ${r.studentName}`.toLowerCase().includes(text)));
  }

  function gradingRubricSaved(a) {
    return !!(a && a.maxScore && String(a.rubric || '').trim());
  }

  // 줄바꿈 방식이나 50과 50.0 같은 표기 차이는 바뀐 내용으로 보지 않는다.
  function rubricText(value) {
    return String(value || '').replace(/\r\n?/g, '\n').trim();
  }

  function rubricDirty(a) {
    const edit = a && S.rubricEdits[a.key];
    return !!edit && (Number(edit.maxScore || 0) !== Number(a.maxScore || 0) || rubricText(edit.rubric) !== rubricText(a.rubric));
  }

  function gradingUnsavedRubrics() {
    return ((S.grading && S.grading.assignments) || []).filter(rubricDirty);
  }

  function rubricValues(a) {
    const edit = S.rubricEdits[a.key];
    return edit || { maxScore: String(a.maxScore || a.maxPoints || ''), rubric: String(a.rubric || '') };
  }

  // 저장한 기준과 다르거나, 아직 저장하지 않았는데 내용이 있으면 저장할 수 있다.
  function rubricCanSave(a) {
    return rubricDirty(a) || (!gradingRubricSaved(a) && !!rubricValues(a).rubric.trim());
  }

  function rubricPill(a) {
    if (!gradingRubricSaved(a)) return '<span class="pill warn">입력 필요</span>';
    return rubricDirty(a) ? '<span class="pill warn">저장 안 함</span>' : '<span class="pill ok">저장됨</span>';
  }

  function gradingReadyHelp(a) {
    if (!gradingRubricSaved(a)) return '채점 기준과 만점을 저장해야 채점할 수 있어요.';
    return rubricDirty(a) ? '바꾼 채점 기준을 저장해야 채점할 수 있어요.' : '';
  }

  function gradingCanStart(a) {
    return !S.busy && S.boot.status.grading.state !== 'ON' && S.selected.size > 0 && !gradingReadyHelp(a);
  }

  // 입력 중에는 화면을 다시 그리지 않으므로, 저장 상태가 드러나는 곳만 바로 바꾼다.
  function syncRubricState(a) {
    const save = document.querySelector('[data-action="save-rubric"]');
    const start = document.querySelector('[data-action="make-grades"]');
    const pill = $('#rubric-pill');
    const help = $('#grading-ready-help');
    if (save) save.disabled = !rubricCanSave(a);
    if (start) start.disabled = !gradingCanStart(a);
    if (pill) pill.innerHTML = rubricPill(a);
    if (help) {
      help.textContent = gradingReadyHelp(a);
      help.style.display = help.textContent ? '' : 'none';
    }
  }

  function gradingRubricCard(a) {
    const saved = gradingRubricSaved(a);
    const values = rubricValues(a);
    return `
      <div class="card ${saved ? '' : 'hero'}">
        <div class="row between">
          <div class="prompt-card-title">채점 기준 <span id="rubric-pill">${rubricPill(a)}</span></div>
          ${a.description ? '<button class="btn" data-action="copy-description">과제 본문 복사해 오기</button>' : ''}
        </div>
        <p class="muted small" style="margin:6px 0 10px">이 과제를 채점할 기준이에요. AI는 여기에 저장한 기준으로만 채점해요. 평가 요소와 충족 개수별 점수처럼 점수를 정하는 방법까지 적어 주세요.</p>
        <label class="field"><span>만점</span>
          <input type="number" id="grading-max" class="length-input" style="width:96px" min="0" step="any" value="${esc(values.maxScore)}"></label>
        <label class="field"><span>채점 기준</span>
          <textarea id="grading-rubric" rows="10" placeholder="예: 평가 요소 5개 중 충족한 개수에 따라 5개 50점, 4개 30점, 3개 20점, 2개 10점, 0~1개 3점">${esc(values.rubric)}</textarea></label>
        <div class="row" style="justify-content:flex-end">
          <button class="btn primary" data-action="save-rubric" ${rubricCanSave(a) ? '' : 'disabled'}>채점 기준 저장</button>
        </div>
      </div>`;
  }

  function gradeStatusPill(r) {
    const status = r.gradeStatus;
    if (!status) return '<span class="pill">채점 전</span>';
    if (status === '대기' || status === '생성중') {
      return jobRunning('grading') ? `<span class="pill run">${esc(status)}</span>` : '<span class="pill warn">멈춤</span>';
    }
    if (status === '오류' || status === '재시도필요') return `<span class="pill err">${esc(status)}</span>`;
    if (status === '내용 없음') return '<span class="pill warn">내용 없음</span>';
    return '<span class="pill ok">채점 완료</span>';
  }

  function gradingCard(r) {
    const edit = S.edits[`grading:${r.key}`] || {};
    const score = edit.score !== undefined ? edit.score : r.score;
    const reason = edit.reason !== undefined ? edit.reason : r.reason;
    const done = r.gradeStatus === '완료';
    const running = jobRunning('grading');
    return `
      <div class="record ${r.teacherChecked ? 'checked' : ''}">
        <div class="row between">
          <label class="row">
            <input type="checkbox" data-action="select-one" data-key="${esc(r.key)}" ${S.selected.has(r.key) ? 'checked' : ''}>
            <b>${esc(r.studentNo)} ${esc(r.studentName)}</b>
            ${gradeStatusPill(r)}
          </label>
          ${done ? `<label class="row small"><input type="checkbox" data-action="check-grade" data-key="${esc(r.key)}" ${r.teacherChecked ? 'checked' : ''}> 확인함 (초안에 반영)</label>` : ''}
        </div>
        ${done ? `
          <div class="row" style="margin-top:10px">
            <input type="number" class="length-input" style="width:96px" min="0" max="${esc(r.maxScore)}" step="any" aria-label="점수" data-action="edit-grade" data-field="score" data-key="${esc(r.key)}" value="${esc(score)}">
            <span>/ ${esc(r.maxScore)}점</span>
          </div>
          <textarea aria-label="채점 이유" data-action="edit-grade" data-field="reason" data-key="${esc(r.key)}">${esc(reason)}</textarea>` : ''}
        <div class="row between">
          <span class="muted small">${esc(r.gradedAt)}</span>
          <div class="row">
            ${r.row ? `<button class="btn danger" data-action="delete-grade" data-key="${esc(r.key)}" ${S.busy || running ? 'disabled' : ''}>결과 지우기</button>` : ''}
            <button class="btn" data-action="show-text" data-key="${esc(r.key)}">제출물 보기</button>
            ${done ? `<button class="btn primary" data-action="save-grade" data-key="${esc(r.key)}" ${S.edits[`grading:${r.key}`] ? '' : 'disabled'}>저장</button>` : ''}
          </div>
        </div>
        ${r.caution ? `<div class="caution">${esc(r.caution)}</div>` : ''}
      </div>`;
  }

  function viewGrading() {
    const d = S.grading;
    if (!d) return '<div class="loading">불러오는 중…</div>';

    const head = `
      <h1>채점</h1>
      <p class="lead">[과제·제출물 수집]을 마친 과제를 채점할 수 있어요. 입력한 채점 기준으로 AI가 학생별 점수와 이유를 매기고, 점수를 확인해 [확인함]을 체크하면 초안 만들 때 참고돼요.</p>
      ${busyNote()}`;
    if (!d.assignments.length) return `${head}<div class="card empty">아직 채점할 수 있는 과제가 없어요. 먼저 제출물을 수집해 주세요.
      <div style="margin-top:12px"><button class="btn primary" data-go="collect">과제·제출물 수집으로 이동</button></div></div>`;

    const a = gradingAssignment();
    const st = S.boot.status.grading;
    const running = st.state === 'ON';
    const rows = gradingRows();
    const shown = rows.slice(0, S.pageSize.grading);
    const readyHelp = gradingReadyHelp(a);
    const allSelected = rows.length > 0 && rows.every(r => S.selected.has(r.key));
    const results = rows.filter(r => r.row);

    return `
      ${head}
      <div class="toolbar">
        <select id="grading-assignment" class="grow">${d.assignments.map(x => `<option value="${esc(x.key)}" ${x.key === a.key ? 'selected' : ''}>${esc(x.courseName)} · ${esc(x.assignmentTitle)}${gradingRubricSaved(x) ? '' : ' (기준 입력 필요)'}</option>`).join('')}</select>
      </div>
      <div class="help" style="margin-bottom:12px">수집을 마친 과제 <b>${d.assignments.length}</b>개가 위 목록에 있어요. 목록에 없는 과제는 [과제·제출물 수집]을 먼저 해 주세요.</div>
      ${gradingRubricCard(a)}
      ${promptCard('GRADING_GUIDE', '채점 공통 지침 확인')}
      ${statusPanel('grading', '개')}
      ${!running && st.remaining > 0 ? `
        <div class="card row between"><div>채점하지 못하고 남은 제출물이 <b>${st.remaining}</b>개 있어요.</div>
          <button class="btn" data-action="resume-grades" ${S.busy ? 'disabled' : ''}>남은 것 이어서 채점하기</button></div>` : ''}
      <div class="toolbar">
        <input type="search" id="search" class="grow" placeholder="학생 이름·번호로 찾기" value="${esc(S.filters.search)}">
        <button class="btn" data-action="reload-grading">새로고침</button>
        ${d.rows.some(r => r.row) ? downloadButton('grading') : ''}
      </div>
      <div class="toolbar">
        <label class="row small"><input type="checkbox" data-action="select-all-grades" ${allSelected ? 'checked' : ''}> 전체 선택</label>
        <button class="btn" data-action="select-ungraded">채점 안 된 것만 선택</button>
        <button class="btn" data-action="select-clear">선택 해제</button>
        <span class="grow"></span>
        <span class="muted">선택 <b>${S.selected.size}</b>개</span>
        <button class="btn primary" data-action="make-grades" ${gradingCanStart(a) ? '' : 'disabled'}>선택한 ${S.selected.size}개 채점하기</button>
      </div>
      <div class="help" id="grading-ready-help" ${readyHelp ? '' : 'style="display:none"'}>${esc(readyHelp)}</div>
      ${results.length ? `<div class="row" style="justify-content:flex-end;margin-bottom:8px">
        <button class="btn danger" data-action="delete-grades-filtered" ${S.busy || running ? 'disabled' : ''}>목록의 결과 ${results.length}개 모두 지우기</button></div>` : ''}
      ${shown.map(gradingCard).join('') || '<div class="card empty">조건에 맞는 제출물이 없어요.</div>'}
      ${rows.length > shown.length ? `<button class="btn" data-action="more" data-kind="grading">더 보기 (${rows.length - shown.length}개 남음)</button>` : ''}`;
  }

  async function saveGrade(r, patch) {
    gradingChanges++;
    Object.assign(r, await call('uiUpdateGrade', r.row, r.key, patch));
    delete S.edits[`grading:${r.key}`];
  }

  async function deleteGrades(items) {
    await withBusy('지우는 중…', async () => {
      try {
        const result = await call('uiDeleteGrades', items.map(r => ({ row: r.row, key: r.key })));
        items.forEach(r => delete S.edits[`grading:${r.key}`]);
        S.grading = result.data;
        banner(`${result.deleted}개를 지웠어요.`, 'ok');
      } catch (err) {
        S.grading = await call('uiGetGrading');
        throw err;
      }
    });
  }

  function findGrade(key) {
    return ((S.grading && S.grading.rows) || []).find(r => r.key === key);
  }

  const GRADING_ACTIONS = {
    async 'save-rubric'() {
      const a = gradingAssignment();
      const values = rubricValues(a);
      await withBusy('채점 기준을 저장하는 중…', async () => {
        S.grading = await call('uiSaveGradingRubric', a.key, values.maxScore, values.rubric);
        delete S.rubricEdits[a.key];
        banner('채점 기준을 저장했어요.', 'ok');
      });
    },
    async 'copy-description'() {
      const a = gradingAssignment();
      const values = rubricValues(a);
      if (values.rubric.trim() && !await confirmModal('과제 본문 복사해 오기', '지금 적힌 채점 기준을 지우고 과제 본문으로 바꿀까요?\n[채점 기준 저장]을 눌러야 실제로 쓰여요.', '바꾸기')) return;
      S.rubricEdits[a.key] = { maxScore: values.maxScore, rubric: String(a.description || '') };
      render();
    },
    'select-all-grades'(el) {
      gradingRows().forEach(r => {
        if (el.checked) S.selected.add(r.key); else S.selected.delete(r.key);
      });
      render();
    },
    'select-ungraded'() {
      S.selected = new Set(gradingRows()
        .filter(r => Number(r.textChars) > 0 && !['완료', '대기', '생성중'].includes(r.gradeStatus))
        .map(r => r.key));
      render();
    },
    async 'make-grades'() {
      const keys = Array.from(S.selected);
      const rows = keys.map(findGrade).filter(Boolean);
      const graded = rows.filter(r => r.gradeStatus === '완료').length;
      const checked = rows.filter(r => r.teacherChecked).length;
      if (!await preparePrompt('GRADING_GUIDE')) return;
      const notes = [
        graded ? `이미 채점한 ${graded}개는 지금 점수를 지우고 새로 채점해요.` : '',
        checked ? `그중 확인한 ${checked}개는 확인이 풀리고, 초안에 넘긴 점수도 지워져요.` : '',
      ].filter(Boolean).join('\n');
      if (!await confirmModal('채점하기', `선택한 제출물 ${keys.length}개를 AI로 채점할까요?${notes ? `\n${notes}` : ''}`, '채점하기')) return;
      await withBusy('채점하는 중… 첫 묶음은 몇 분 걸릴 수 있어요. 창을 닫아도 계속 진행돼요.', async () => {
        await call('uiQueueGrades', keys);
        const result = await call('uiStartGrades');
        keys.forEach(key => delete S.edits[`grading:${key}`]);
        S.selected = new Set();
        S.grading = result.data;
        afterToolStart(result, '채점을 시작했어요. 남은 것은 자동으로 이어서 채점해요.');
      });
    },
    async 'resume-grades'() {
      if (!await preparePrompt('GRADING_GUIDE')) return;
      await withBusy('남은 제출물을 이어서 채점하는 중…', async () => {
        const result = await call('uiStartGrades');
        S.grading = result.data;
        afterToolStart(result, '이어서 채점을 시작했어요.');
      });
    },
    async 'reload-grading'() {
      await withBusy('불러오는 중…', async () => { S.grading = await call('uiGetGrading'); });
    },
    async 'save-grade'(el) {
      const r = findGrade(el.dataset.key);
      el.disabled = true;
      try {
        await saveGrade(r, S.edits[`grading:${r.key}`]);
        banner('저장했어요.', 'ok');
      } catch (err) {
        showError(err);
      }
      render();
    },
    async 'check-grade'(el) {
      const r = findGrade(el.dataset.key);
      try {
        await saveGrade(r, Object.assign({}, S.edits[`grading:${r.key}`], { teacherChecked: el.checked }));
      } catch (err) {
        el.checked = !el.checked;
        showError(err);
      }
      render();
    },
    async 'delete-grade'(el) {
      const r = findGrade(el.dataset.key);
      const note = r.teacherChecked ? '\n초안에 넘긴 점수도 함께 지워져요.' : '';
      if (!await confirmModal('결과 지우기', `${r.studentNo} ${r.studentName} 학생의 채점 결과를 지울까요?${note}\n시트에서도 지워지고 되돌릴 수 없어요.`, '지우기')) return;
      await deleteGrades([r]);
    },
    async 'delete-grades-filtered'() {
      const rows = gradingRows().filter(r => r.row);
      if (!rows.length) return;
      if (!await confirmModal('모두 지우기', `지금 목록에 있는 채점 결과 ${rows.length}개를 모두 지울까요?\n확인한 점수는 초안에 넘긴 값도 함께 지워져요. 시트에서도 지워지고 되돌릴 수 없어요.`, `${rows.length}개 지우기`)) return;
      await deleteGrades(rows);
    },
  };

  // 입력 중에는 다시 그리지 않고 저장 버튼만 바꾼다.
  function handleGradingInput(el) {
    if (el.id === 'grading-max' || el.id === 'grading-rubric') {
      const a = gradingAssignment();
      S.rubricEdits[a.key] = { maxScore: $('#grading-max').value, rubric: $('#grading-rubric').value };
      syncRubricState(a);
      return true;
    }
    if (el.dataset.action === 'edit-grade') {
      const r = findGrade(el.dataset.key);
      const editKey = `grading:${r.key}`;
      const edit = S.edits[editKey] || {};
      const field = el.dataset.field;
      if (el.value === String(r[field])) delete edit[field]; else edit[field] = el.value;
      if (Object.keys(edit).length) S.edits[editKey] = edit; else delete S.edits[editKey];
      const btn = el.closest('.record').querySelector('[data-action="save-grade"]');
      if (btn) btn.disabled = !S.edits[editKey];
      return true;
    }
    return false;
  }

  const TOOL_VIEWS = { common: viewCommon, behavior: viewBehavior, manual: viewManual, grading: viewGrading, ocr: viewOcr };

  // ---- 동작 ---------------------------------------------------------------
  function afterToolStart(result, fallback) {
    S.boot.status = result.status;
    showMessages(result, fallback);
    updatePolling();
  }

  function findBehavior(row) {
    return (S.behavior.rows || []).find(r => r.row === Number(row));
  }

  function replaceBehavior(updated) {
    const i = S.behavior.rows.findIndex(r => r.row === updated.row);
    if (i >= 0) S.behavior.rows[i] = updated;
  }

  const TOOL_ACTIONS = {
    async 'start-common'() {
      const input = {
        sourceText: $('#cp-source').value,
        prompt: $('#cp-prompt').value,
        count: Number($('#cp-count').value),
      };
      if (!input.sourceText.trim() || !input.prompt.trim()) return banner('바탕 문구와 지시사항을 모두 입력하세요.', 'err');
      if (!await confirmModal('공통문구 만들기', `문구 ${input.count}개를 AI로 만들까요?\n이전에 만든 문구는 지워져요.`, '만들기')) return;
      await withBusy('문구를 만드는 중… 첫 묶음은 1~2분 걸릴 수 있어요. 창을 닫아도 계속 진행돼요.', async () => {
        const result = await call('uiStartCommonPhrases', input);
        S.common = result.data;
        afterToolStart(result, '문구 만들기를 시작했어요. 남은 것은 자동으로 이어서 만들어요.');
      });
    },
    async 'resume-common'() {
      await withBusy('남은 문구를 이어서 만드는 중…', async () => {
        const result = await call('uiResumeCommonPhrases');
        S.common = result.data;
        afterToolStart(result, '이어서 만들기를 시작했어요.');
      });
    },
    async 'reload-common'() {
      await withBusy('불러오는 중…', async () => { S.common = await call('uiGetCommonPhrases'); });
    },
    'copy-all-common'() {
      copyText(S.common.phrases.filter(p => p.text).map(p => S.edits[`common:${p.row}`] !== undefined ? S.edits[`common:${p.row}`] : p.text).join('\n'));
    },

    'open-behavior'(el) {
      const r = findBehavior(el.dataset.id);
      if (!r) return;
      if (S.bDraft && S.bDraft.dirty) return banner('열려 있는 학생의 입력 내용을 먼저 저장하거나 닫아 주세요.', 'err');
      const fields = {};
      ['studentName', 'selectedTraits', 'customTraits'].concat(BEHAVIOR_FIELDS.map(f => f.key)).forEach(k => { fields[k] = String(r[k] || ''); });
      // 드롭다운에 없는 특성(예전 목록 값)은 '목록에 없는 특성' 칸으로 옮긴다.
      const picked = splitTraits(fields.selectedTraits);
      const extra = picked.filter(t => !S.behavior.traits.includes(t));
      if (extra.length) {
        const custom = splitTraits(fields.customTraits);
        fields.selectedTraits = picked.filter(t => S.behavior.traits.includes(t)).join(', ');
        fields.customTraits = custom.concat(extra.filter(t => !custom.includes(t))).join(', ');
      }
      // 시트 드롭다운에 없어 '목록에 없는 특성' 칸에 저장된 기본 특성은 다시 칩으로 보여 준다.
      const custom = splitTraits(fields.customTraits);
      const listed = custom.filter(t => S.behavior.traits.includes(t));
      if (listed.length) {
        const selected = splitTraits(fields.selectedTraits);
        fields.selectedTraits = selected.concat(listed.filter(t => !selected.includes(t))).join(', ');
        fields.customTraits = custom.filter(t => !listed.includes(t)).join(', ');
      }
      S.bDraft = { row: r.row, name: String(r.studentName || ''), fields, dirty: extra.length > 0 };
      render();
    },
    async 'close-behavior'() {
      if (S.bDraft.dirty) {
        const choice = await choiceModal('저장하지 않은 내용', '입력한 내용을 저장하지 않았어요.', [
          { value: 'discard', label: '저장하지 않고 닫기' },
          { value: 'save', label: '저장하고 닫기', kind: 'primary' },
        ]);
        if (!choice || !S.bDraft) return;
        if (choice === 'save') return TOOL_ACTIONS['save-behavior']();
      }
      S.bDraft = null;
      render();
    },
    'toggle-trait'(el) {
      const list = splitTraits(S.bDraft.fields.selectedTraits);
      const t = el.dataset.trait;
      // '없음'은 다른 특성과 함께 고를 수 없다.
      const next = list.includes(t) ? list.filter(x => x !== t) : t === '없음' ? [t] : list.filter(x => x !== '없음').concat(t);
      S.bDraft.fields.selectedTraits = next.join(', ');
      S.bDraft.dirty = true;
      // 화면 전체를 다시 그리지 않고 칩 표시와 저장 버튼만 바꾼다.
      document.querySelectorAll('[data-action="toggle-trait"]').forEach(chip => {
        chip.classList.toggle('on', next.includes(chip.dataset.trait));
      });
      const btn = document.querySelector('[data-action="save-behavior"]');
      if (btn) btn.disabled = false;
    },
    // 입력 칸은 바로 닫고 저장은 뒤에서 한다. 실패하면 입력 칸을 다시 연다.
    async 'save-behavior'() {
      const draft = S.bDraft;
      const r = findBehavior(draft.row);
      const before = Object.assign({}, r);
      Object.assign(r, draft.fields);
      S.bDraft = null;
      render();
      banner('저장했어요.', 'ok');
      try {
        const updated = await call('uiSaveBehaviorRow', draft.row, draft.name, draft.fields);
        replaceBehavior(updated);
        if (S.view === 'behavior' && !isEditing()) render();
      } catch (err) {
        Object.assign(r, before);
        if (!S.bDraft) S.bDraft = draft;
        if (S.view === 'behavior') render();
        showError(err);
      }
    },
    async 'reset-behavior'(el) {
      if (!await confirmModal('추천 문구 지우기', '추천 문구를 지울까요?\n입력한 특성과 관찰 내용은 그대로 두고, [추천 문구 만들기]를 누르면 새로 만들어요.', '지우기')) return;
      await withBusy('지우는 중…', async () => {
        const updated = await call('uiResetBehaviorResult', Number(el.dataset.id), S.bDraft ? S.bDraft.name : findBehavior(el.dataset.id).studentName);
        replaceBehavior(updated);

    async 'ocr-save-model'() {
