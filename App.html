<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include_('AppStyles'); ?>
  <script>
    // 화면이 '불러오는 중'에서 멈출 때 원인을 화면에 보여준다.
    window.__bootErrors = [];
    window.addEventListener('error', e => {
      window.__bootErrors.push(`${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno || ''})`);
    });
    setTimeout(() => {
      const loading = document.querySelector('#view .loading');
      if (!loading) return;
      loading.innerHTML = window.__bootErrors.length
        ? '화면을 여는 중 오류가 났어요. 아래 내용을 알려 주세요.<br><br>' + window.__bootErrors.map(m => String(m).replace(/</g, '&lt;')).join('<br>')
        : '서버 응답을 기다리고 있어요. 계속 이 상태면 대화상자를 닫고 다시 열어 주세요.';
    }, 15000);
  </script>
</head>
<body>
  <div class="app">
    <aside class="nav">
      <div class="brand">생기부 도우미</div>
      <nav id="steps"></nav>
      <div class="nav-foot">
        <button class="link" data-go="settings">⚙ 설정</button>
        <div id="ai-badge" class="ai-badge"></div>
      </div>
    </aside>

    <main class="main">
      <div id="banner" class="banner hidden"></div>
      <div id="view" class="view">
        <div class="loading">불러오는 중…</div>
      </div>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <div id="modal-title"></div>
        <button class="icon" id="modal-close" aria-label="닫기">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <?!= include_('AppScript'); ?>
  <?!= include_('AppTools'); ?>
</body>
</html>
