<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1f2933;
    --muted: #6b7785;
    --line: #e3e7ec;
    --primary: #2f6fde;
    --primary-soft: #e8f0fd;
    --ok: #1f8a4c;
    --ok-soft: #e5f5ec;
    --warn: #b7791f;
    --warn-soft: #fdf3e1;
    --err: #c53030;
    --err-soft: #fdeaea;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Noto Sans KR', 'Malgun Gothic', -apple-system, sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
  }

  .app { display: flex; height: 100vh; }

  /* 왼쪽 단계 메뉴 */
  .nav {
    width: 210px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 16px 10px;
  }

  .brand { font-weight: 700; font-size: 16px; padding: 4px 10px 14px; }

  .step {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 8px;
    background: none;
    font: inherit;
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }

  .step:hover { background: var(--bg); }
  .step.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }

  .dot {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 12px;
    border: 1.5px solid var(--line);
    color: var(--muted);
  }

  .dot.done { background: var(--ok); border-color: var(--ok); color: #fff; }
  .dot.running { border-color: var(--primary); color: var(--primary); }
  .dot.next { border-color: var(--primary); background: var(--primary); color: #fff; }

  .nav-foot { margin-top: auto; padding: 0 10px; }
  .ai-badge { margin-top: 8px; font-size: 12px; color: var(--muted); }

  /* 본문 */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .view { flex: 1; overflow-y: auto; padding: 24px 28px 40px; }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; }

  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .lead { color: var(--muted); margin: 0 0 20px; line-height: 1.6; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 16px;
  }

  .card.hero { border-color: var(--primary); box-shadow: 0 2px 10px rgba(47, 111, 222, .08); }

  /* 수동추가: 파일 올리기 / 구글 설문 두 가지 가져오기 방법 */
  .source-intro { margin: 0 0 14px; color: var(--muted); }
  .source-pick { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; align-items: stretch; }
  .source { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .source-file { background: var(--primary-soft); border-color: #cfdcf6; }
  .source-form { background: var(--ok-soft); border-color: #c6e6d3; }
  .source-head { display: flex; gap: 10px; align-items: flex-start; }
  .source-head h3 { font-size: 15px; margin: 0 0 2px; }
  .source-head p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .source-badge { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
  .source-file .source-badge { background: var(--primary); }
  .source-form .source-badge { background: var(--ok); }
  .source-or { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 12px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .source-or::before, .source-or::after { content: ''; flex: 1; width: 1px; background: var(--line); }
  .source-or span { padding: 8px 0; }

  .dropzone { position: relative; flex: 1; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 18px; background: var(--panel); border: 2px dashed #a9c1ee; border-radius: 8px; cursor: pointer; transition: border-color .15s, background .15s; }
  .dropzone input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .dropzone:hover, .dropzone:focus-within { border-color: var(--primary); }
  .dropzone.over { border-color: var(--primary); border-style: solid; background: #f3f7fe; }
  .dropzone.disabled { cursor: not-allowed; opacity: .6; }
  .drop-icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-size: 18px; font-weight: 700; margin-bottom: 4px; }

  .url-field { display: flex; gap: 6px; }
  .url-field input { flex: 1; min-width: 0; background: var(--panel); }
  .source-steps { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.7; }
  .source-form .help { margin-top: auto; }

  @media (max-width: 760px) {
    .source-pick { grid-template-columns: 1fr; }
    .source-or { flex-direction: row; padding: 10px 0; }
    .source-or::before, .source-or::after { width: auto; height: 1px; }
    .source-or span { padding: 0 10px; }
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .ocr-guide ol { font-size: 14px; }
  .ocr-guide .tip, .ocr-guide .save-warn { font-size: 14px; }
  .hidden { display: none !important; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat b { display: block; font-size: 22px; margin-top: 4px; }

  /* 버튼 / 입력 */
  button { font: inherit; }

  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }

  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.download { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
  .btn.download:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--err); }
  .btn.danger.fill { background: var(--err); border-color: var(--err); color: #fff; font-weight: 600; }
  .btn.danger.fill:hover { filter: brightness(1.08); }
  .btn.lg { padding: 11px 22px; font-size: 15px; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .link { border: 0; background: none; color: var(--primary); cursor: pointer; padding: 0; }
  .icon { border: 0; background: none; cursor: pointer; font-size: 16px; color: var(--muted); }

  input[type=text], input[type=password], input[type=number], input[type=search], select, textarea {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
  }

  textarea { width: 100%; resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }

  label.field { display: block; margin-bottom: 14px; }
  label.field > span { display: block; font-weight: 600; margin-bottom: 6px; }
  .help { font-size: 12px; color: var(--muted); white-space: pre-line; margin-top: 4px; line-height: 1.5; }

  /* AI 선택 카드 */
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }

  .choice {
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    background: var(--panel);
    text-align: left;
  }

  .choice.selected { border-color: var(--primary); background: var(--primary-soft); }
  .choice b { display: block; margin-bottom: 4px; }

  /* 표 */
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); position: sticky; top: 0; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--bg); }
  .table-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: 420px; }

  .group-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--line); font-weight: 600; }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .list { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
  .collect-bar { position: sticky; bottom: -40px; z-index: 2; margin-top: 16px; box-shadow: 0 -4px 12px rgba(0, 0, 0, .06); }

  /* 상태 표시 */
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--bg); color: var(--muted); }
  .group-hide { padding: 0 4px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; font-weight: 400; cursor: pointer; }
  .group-hide:hover { color: var(--err); }
  .pill-clear { margin-left: 4px; padding: 0 2px; border: 0; background: none; color: inherit; font: inherit; line-height: 1; cursor: pointer; }
  .pill-clear:hover { color: var(--err); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.err { background: var(--err-soft); color: var(--err); }
  .pill.run { background: var(--primary-soft); color: var(--primary); }

  .banner { margin: 12px 28px 0; padding: 10px 14px; border-radius: 8px; white-space: pre-line; line-height: 1.5; display: flex; gap: 10px; }
  .banner.info { background: var(--primary-soft); color: #1d4ea3; }
  .banner.ok { background: var(--ok-soft); color: var(--ok); }
  .banner.err { background: var(--err-soft); color: var(--err); }
  .banner .grow { white-space: pre-line; }
  .tip { background: var(--primary-soft); color: #1d4ea3; border-radius: 8px; padding: 8px 12px; margin: 0 0 10px; font-size: 13px; line-height: 1.6; }
  .save-warn { background: var(--warn-soft); color: #8a5a12; border-left: 4px solid var(--warn); border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: 600; line-height: 1.5; }
  .save-warn.inline { padding: 6px 10px; margin-right: auto; }
  .prompt-example { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; margin: 0 0 10px; background: var(--bg); }
  .prompt-example summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  .prompt-example pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; line-height: 1.6; margin: 8px 0; }
  .banner .banner-close { align-self: flex-start; flex-shrink: 0; padding: 4px 10px; font-size: 13px; }

  .progress { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; margin: 10px 0 6px; }
  .progress > div { height: 100%; background: var(--primary); transition: width .4s; }

  .spinner { width: 14px; height: 14px; border: 2px solid var(--primary-soft); border-top-color: var(--primary); border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 초안 카드 */
  .record { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .record.checked { border-color: var(--ok); }
  .record textarea { min-height: 120px; margin: 10px 0 6px; overflow-y: hidden; }
  .record .caution { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 6px 10px; font-size: 12px; margin-top: 8px; white-space: pre-line; }
  .bytes.over { color: var(--err); font-weight: 600; }
  .bytes.near { color: var(--warn); font-weight: 600; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .tab { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

  /* 모달 */
  .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .35); display: grid; place-items: center; z-index: 10; }
  .modal-box { width: min(820px, 92vw); max-height: 86vh; background: var(--panel); border-radius: 12px; display: flex; flex-direction: column; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .modal-body { padding: 16px 18px; overflow-y: auto; white-space: pre-wrap; line-height: 1.7; }

  /* 도구 화면 */
  .nav-label { font-size: 11px; color: var(--muted); padding: 16px 10px 6px; letter-spacing: .05em; }
  .dot.tool { border-style: dashed; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; color: var(--text); display: inline-flex; align-items: center; gap: 4px; }
  .chip.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .chip input { margin: 0; }
  .chip.neg { border-style: dashed; }
  .chip.neg.on { border-color: var(--warn); border-style: solid; background: var(--warn-soft); color: var(--warn); }
  .record.dup { border-color: var(--warn); }
  .record.open { border-color: var(--primary); margin: 8px; }
  .record.open textarea { min-height: 0; margin: 0; }
  .record textarea[data-action="edit-tool"] { min-height: 70px; }
  .item.clickable { cursor: pointer; }
  .item.clickable:hover { background: var(--bg); }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .divider { border-top: 1px solid var(--line); margin: 14px 0 10px; }
  .pre { white-space: pre-wrap; background: var(--bg); border-radius: 6px; padding: 8px 10px; margin-top: 6px; line-height: 1.6; max-height: 220px; overflow-y: auto; }
  details > summary { cursor: pointer; }
  details.card > summary { margin: -4px 0; }
  details.card[open] > summary { margin-bottom: 12px; }
  details.small { margin-top: 8px; }
  /* 프롬프트 확인 카드: 접혀 있어도 눈에 띄게 왼쪽 띠와 연한 배경, 열기 안내를 둔다. */
  details.prompt-card { border-left: 4px solid var(--primary); background: linear-gradient(90deg, var(--primary-soft), var(--panel) 60%); }
  details.prompt-card[open] { background: var(--panel); }
  details.prompt-card > summary { display: flex; align-items: center; gap: 12px; list-style: none; padding: 4px 0; }
  details.prompt-card > summary::-webkit-details-marker { display: none; }
  .prompt-card-icon { font-size: 22px; line-height: 1; }
  .prompt-card-head { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .prompt-card-title { font-size: 15px; font-weight: 700; color: var(--primary); }
  .prompt-card-toggle { flex: none; font-size: 13px; font-weight: 600; color: var(--primary); border: 1px solid var(--primary); border-radius: 999px; padding: 4px 12px; background: var(--panel); white-space: nowrap; }
  .prompt-card-toggle::after { content: '열어서 확인 ▾'; }
  details.prompt-card[open] .prompt-card-toggle::after { content: '접기 ▴'; }
  .length-card { border-left: 4px solid var(--primary); }
  .length-card-head { display: flex; align-items: center; gap: 12px; }
  .length-card-inputs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-left: 34px; }
  .length-card-inputs .length-input { width: 96px; text-align: right; }

  .empty { text-align: center; color: var(--muted); padding: 36px 0; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
</style>
